      /* Tant que le maitre n'a pas confirme, on le dit : annoncer
         « connecte » sur la foi de son propre appui est un mensonge de
         cinq secondes quand le mot de passe est faux. */
      c2.appendChild(el('div','lbl',
        confirme ? 'Tu es connecte' : 'En attente du salon…'));
      var row=el('button','me'); row.appendChild(el('span','dot'));
      row.appendChild(el('span',null, mine ? mine.name : 'Joueur'));
      row.onclick=function(){};
      c2.appendChild(row);
      c2.appendChild(el('div',null,
        (interrompu && Date.now() - interrompu < 20000)
          ? 'La manche a ete interrompue sur le telephone principal.'
          : (state.game
              ? 'Suis la partie sur l’ecran principal.'
              : 'En attente du lancement d’un jeu.')));
      app.appendChild(c2);
    } else {
      var c3=el('div','card');
      if(scene){
        app.appendChild(el('div','banner',
          'Une partie est en cours. Dis qui tu es pour la suivre ici.'));
      }
      c3.appendChild(el('div','lbl','Qui es-tu ?'));
      players.forEach(function(p){
        /* GRISE SI TENU, point vert si joignable — deux choses
           differentes. Un joueur dont le telephone dort reste a lui : sans
           cette distinction, il apparaissait libre, le premier venu le
           reprenait, et la retention de cinq minutes cote maitre ne servait
           a rien. */
        var tenu = p.held !== undefined ? p.held : p.connected;
        var b2=el('button', tenu?'taken':null);
        if(p.connected) b2.appendChild(el('span','dot'));
        b2.appendChild(el('span',null,p.name + (tenu?' — deja pris':'')));
        b2.onclick=function(){
          myClaim = p.id; S.setItem(claimKey, p.id);
          intent('claim',{player:p.id});
          render(1);
        };
        c3.appendChild(b2);
      });
      if(adding){
        var i2=el('input'); i2.type='text'; i2.placeholder='Ton prenom';
        i2.value = nameDraft;
        i2.oninput = function(){ nameDraft = i2.value; };
        i2.onblur = function(){ lastBlur = Date.now(); };
        c3.appendChild(i2);
        var ok=el('button','primary','Rejoindre');
        ok.onclick=function(){
          var n=i2.value.trim(); if(!n) return;
          i2.blur(); nameDraft=''; adding=false;
          /* On ne connait pas encore l'identifiant du joueur cree — c'est le
             maitre qui le fabrique. On le retiendra a la premiere reponse,
             voir plus bas. */
          intent('add',{name:n}); render(1);
        };
        c3.appendChild(ok);
      } else {
        var add=el('button',null,'Je ne suis pas dans la liste');
        add.onclick=function(){ adding=true; render(1); };
        c3.appendChild(add);
      }
      app.appendChild(c3);
    }

  }

  /* L'ECRAN DE PARTIE.

     UN SEUL RENDU POUR TOUS LES JEUX, et c'est le choix qui decide de tout
     le reste. La page ne connait pas « la pyramide » ni « le mot interdit » :
     elle connait un petit vocabulaire de BLOCS, et chaque jeu compose sa
     scene avec ceux qui l'arrangent.

       titre / left / total  — qui joue, et le chrono
       big                   — un mot en grand (la bombe)
       board + it            — l'ardoise en direct
       des                   — des faces de des
       rows                  — un tableau de scores
       teams                 — des equipes et leurs membres
       hint                  — une phrase
       priv                  — ce qui n'est qu'a nous (voir plus bas)

     Le benefice n'est pas l'economie de lignes, c'est qu'une page ANCIENNE
     ne casse pas devant un jeu RECENT : elle affiche les blocs qu'elle
     connait et ignore les autres. Sans ça, chaque nouveau jeu obligerait
     tout le monde a recharger — ou, pire, laisserait un ecran blanc a celui
     qui ne l'a pas fait.

     TOUT SAUF LE MOT DES AUTRES. Ceux qui regardent cet ecran sont ceux qui
     doivent deviner : ce que le maitre n'envoie pas, il n'y a pas a
     l'oublier. Ce qui est adresse a UN joueur voyage brouille avec le secret
     de son appareil (voir `sceller`) — le canal diffuse a tous, mais les
     autres n'en font rien. */
  function sceneScreen(players, mineId){
    var mine = null;
    players.forEach(function(p){ if(p.id === mineId) mine = p; });
    var moi = mine && scene.by && mine.name === scene.by;

    // --- l'entete : qui joue, et le temps qui reste
    if(scene.by || scene.left !== undefined){
      var head = el('div','card');
      var t = el('div','turn');
      t.appendChild(el('span','who', scene.by
        ? (scene.by + (scene.verb ? (' ' + scene.verb) : ''))
        : (scene.titre || '')));
      if(scene.left !== undefined && scene.left !== null){
        t.appendChild(el('span','clock', tempsRestant(scene.left)));
      }
      head.appendChild(t);
      if(scene.total){
        var jauge = el('div','gauge');
        var barre = el('div','fill');
        var part = Math.max(0, Math.min(1, (scene.left || 0) / scene.total));
        barre.style.width = (part * 100) + '%';
        /* Rouge sur la fin : la barre seule se lit mal du coin de l'oeil, et
           c'est precisement a ce moment-la qu'on ne regarde plus le chrono. */
        if(part < 0.2) barre.style.background = '#FF6B6B';
        jauge.appendChild(barre);
        head.appendChild(jauge);
      }
      if(scene.hint) head.appendChild(el('div','hint', moi ? (scene.hintMoi || scene.hint) : scene.hint));
      app.appendChild(head);
    } else if(scene.titre || scene.hint){
      /* SANS EN-TETE, LE TITRE ET LA PHRASE S'AFFICHENT QUAND MEME.
         L'entete n'existe que si le jeu envoie un joueur ou un chrono ; les
         jeux qui n'ont ni l'un ni l'autre — « Ne rigole pas », le photo, la
         mission secrete — voyaient leur `hint` tomber dans le vide. Leur
         verdict n'arrivait donc jamais chez les invites, sans que rien ne le
         signale. */
      var seul = el('div','card');
      if(scene.titre) seul.appendChild(el('div','lbl', scene.titre));
      if(scene.hint) seul.appendChild(el('div','hint', scene.hint));
      app.appendChild(seul);
    }

    // --- CE QUI N'EST QU'A NOUS. Le mot de l'infiltre, le mot interdit, la
    //     mission. On le montre CACHE par defaut : le telephone passe de main
    //     en main, on se penche sur l'ecran du voisin, et un mot secret
    //     affiche en permanence n'est plus secret.
    var part = privee();
    if(part && part.text){
      var c = el('div','card secret');
      c.appendChild(el('div','lbl', part.label || 'Rien qu’a toi'));
      if(devoile){
        c.appendChild(el('div','big', part.text));
        if(part.note) c.appendChild(el('div','hint', part.note));
        /* EN MIME IL N'Y A PAS DE PANNEAU — rien a dessiner, donc rien a
           ouvrir. Les deux boutons du jeu vivent alors sous le mot, ici. */
        posActes(c, part.actes);
        var cacher = el('button', null, 'Cacher');
        cacher.onclick = function(){ devoile = false; render(1); };
        c.appendChild(cacher);
      } else {
        var voir = el('button','primary','• • •  Appuie pour revoir');
        voir.onclick = function(){ devoile = true; render(1); };
        c.appendChild(voir);
      }
      app.appendChild(c);
    }

    // --- UN MOT EN GRAND (la bombe : tout le monde doit le lire d'un coup)
    if(scene.big){
      var b = el('div','card');
      if(scene.bigLbl) b.appendChild(el('div','lbl', scene.bigLbl));
      b.appendChild(el('div','big', scene.big));
      app.appendChild(b);
    }

    // --- LES DES
    if(scene.des && scene.des.length){
      var d = el('div','card');
      d.appendChild(el('div','lbl', scene.desLbl || 'Le tirage'));
      var rang = el('div','dice');
      scene.des.forEach(function(v){ rang.appendChild(deFace(v)); });
      d.appendChild(rang);
      if(scene.desTotal !== undefined && scene.desTotal !== null){
        d.appendChild(el('div','big', String(scene.desTotal)));
      }
      app.appendChild(d);
    }

    // --- LE FORMULAIRE : le bouton qui l'ouvre.
    //
    // Le panneau lui-meme vit hors de `#app` ; ici on ne pose que la porte.
    // Elle reste visible apres l'envoi, avec un autre libelle : l'invite doit
    // pouvoir relire ce qu'il a repondu sans que ça compte pour un renvoi.
    var fCourant = formActuel();
    if(fCourant && fCourant.id){
      var fb = el('div','card');
      fb.appendChild(el('div','lbl', fCourant.titre || 'A toi de jouer'));
      if(fCourant.id === formEnvoye){
        /* « PARTIE » SEULEMENT QUAND C'EST VRAI. Un formulaire `ack` qui nous
           est encore propose n'a PAS ete enregistre (voir `relancerCopie`) :
           on le dit, la copie repart d'elle-meme, et on peut la rouvrir. Les
           autres formulaires restent affiches pour tout le monde apres
           l'envoi ; pour eux, la boite d'envoi dit si le salon l'a recue. */
        var enRoute = fCourant.ack
          || (typeof copieEnVol === 'function' && copieEnVol(fCourant.id));
        if(enRoute){
          fb.appendChild(el('div','hint','Envoi en cours… Le telephone '
            + 'principal n’a pas encore enregistre ta copie : elle repart '
            + 'toute seule.'));
          /* Une copie qu'on peut modifier a deja son bouton, juste dessous. */
          if(!fCourant.modif){
            var revoir = el('button', null, 'Revoir ma copie');
            revoir.onclick = function(){ ouvrirForm(); };
            fb.appendChild(revoir);
          }
        } else {
          fb.appendChild(el('div','hint','Ta reponse est partie. '
            + 'On attend les autres.'));
          /* CE QUE LE JEU PROPOSE A CELUI QUI A RENDU (`fini`) : au petit
             bac, « terminer la manche pour tout le monde ». Meme format que
             les gestes du mime, et meme principe — la page transmet, le
             maitre juge (il refuse si la manche est deja close, ou si la
             copie n'est pas enregistree). Seulement ICI, une fois la copie
             arrivee au salon : pendant l'envoi, le maitre ne sait pas encore
             qu'on a rendu, et refuserait. */
          posActes(fb, fCourant.fini);
        }
        /* « MODIFIER MA COPIE », tant que le formulaire est encore propose,
           c'est-a-dire tant que la manche court. Voir `modifierCopie`. */
        if(fCourant.modif){
          var modif = el('button', null, 'Modifier ma copie');
          modif.onclick = modifierCopie;
          fb.appendChild(modif);
        }
      } else {
        /* LA PORTE N'A PAS LE MEME LIBELLE QUE LE BOUTON D'ENVOI. Les deux
           portaient « rendre ma copie », l'un dans `#app` et l'autre dans le
           panneau : deux boutons identiques a l'ecran, dont un seul envoie
           quoi que ce soit. */
        var ouvre = el('button','primary', 'Répondre');
        ouvre.onclick = function(){ ouvrirForm(); };
        fb.appendChild(ouvre);
      }
      app.appendChild(fb);
    }

    // --- L'ARDOISE
    if(scene.k === 'draw'){
      var cadre = el('div','slate');
      /* LE FOND DU THEME ECLAIRCI, comme l'ardoise du maitre de « Mime ou
         Dessine » : sur le quasi-noir de `.slate`, le noir de sa palette
         ne se voyait pas. Voir `fondArdoiseInvite`. */
      cadre.style.background = fondArdoiseInvite();
      cadre.appendChild(boardEl());
      app.appendChild(cadre);
    }

    // --- LES EQUIPES
    if(scene.teams && scene.teams.length){
      var e = el('div','card');
      e.appendChild(el('div','lbl','Les equipes'));
      scene.teams.forEach(function(eq){
        var l = el('div','row');
        var g = el('div');
        g.appendChild(el('div','nom', eq.n || ''));
        if(eq.m && eq.m.length) g.appendChild(el('div','hint', eq.m.join(', ')));
        l.appendChild(g);
        if(eq.v !== undefined) l.appendChild(el('div','pts', String(eq.v)));
        e.appendChild(l);
      });
      app.appendChild(e);
    }

    // --- LES SCORES.
    //     EN LECTURE SEULE, et ce n'est pas un manque : l'attribution des
    //     points se fait sur le telephone maitre, devant tout le monde. Une
    //     soiree ou chacun peut s'ajouter des points depuis sa poche n'est
    //     plus une soiree, c'est une discussion.
    if(scene.rows && scene.rows.length){
      var r = el('div','card');
      r.appendChild(el('div','lbl', scene.rowsLbl || 'Les scores'));
      scene.rows.forEach(function(ligne){
        var l = el('div','row');
        var g2 = el('div');
        g2.appendChild(el('div','nom', ligne.n || ''));
        if(ligne.s) g2.appendChild(el('div','hint', ligne.s));
        l.appendChild(g2);
        if(ligne.v !== undefined){
          var txt = String(ligne.v);
          /* CHIFFRE OU PHRASE : ce n'est pas la meme colonne. Voir
             `.pts.texte`. On regarde le contenu et pas le jeu, parce que la
             scene ne dit pas de quel jeu elle vient — et qu'un score reste
             un score quel que soit l'expediteur. */
          l.appendChild(el('div',
            /^[-+]?\d+$/.test(txt.trim()) ? 'pts' : 'pts texte', txt));
        }
        r.appendChild(l);
      });
      r.appendChild(el('div','hint',
        'Les points se donnent sur le telephone principal.'));
      app.appendChild(r);
    }

    var q = el('button', null, 'Ce n\u2019est pas moi');
    q.onclick = function(){
      myClaim = null; S.removeItem(claimKey);
      intent('leave', {});
      render(1);
    };
    app.appendChild(q);
  }

  /* NOTRE PART, DESCELLEE. Rendue telle quelle si elle est illisible plutot
     que de lever : un secret regenere (navigateur vide, autre telephone)
     donne du charabia, et un ecran vide vaut mieux qu'une page morte. */
  function privee(){
    if(!scene || !scene.priv) return null;
    var sceau = scene.priv[dev];
    if(!sceau) return null;
    var brut = ouvrir(secret, sceau);
    if(!brut) return null;
    try { return JSON.parse(brut); } catch(e){ return null; }
  }

  /* UNE FACE DE DE, dessinee en points et pas ecrite en chiffre : c'est ce
     qu'on reconnait sans lire, et c'est tout l'interet d'un de. */
  function deFace(v){
    var f = el('div','de');
    var n = Math.max(1, Math.min(6, v | 0));
    /* Les positions classiques, en neuf cases. Le 1 au centre, le 6 en deux
       colonnes de trois — n'importe quel autre arrangement se lit mal. */
    var plans = {
      1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]
    };
    var pts = plans[n];
    for(var i = 0; i < 9; i++){
      var c = el('span', pts.indexOf(i) >= 0 ? 'pip on' : 'pip');
      f.appendChild(c);
    }
    if(v > 6 || v < 1){
      /* Un de a plus de six faces existe (le jeu en propose) : on ecrit
         alors le chiffre, faute de disposition reconnaissable. */
      f.innerHTML = '';
      f.className = 'de chiffre';
      f.textContent = String(v);
    }
    return f;
  }

  /* ------------------------------------------------------------------
     LE DESSIN

     UN SEUL ELEMENT `canvas`, cree une fois et deplace d'un ecran a
     l'autre — jamais recree. Le redessiner reviendrait a effacer l'ardoise
     dix fois par seconde, et surtout a jeter le calque hors ecran ou sont
     figes les elements termines.
     ------------------------------------------------------------------ */
  var board = null;       // ce qu'on voit
  var committed = null;   // le calque hors ecran : tout sauf le dernier
  var painting = false;

  function boardEl(){
    if(board) return board;
    board = document.createElement('canvas');
    board.className = 'board';
    committed = document.createElement('canvas');
    return board;
  }

  /* Le cadre du dessin dans le canvas, aux proportions de l'ardoise du
     maitre. SANS LUI, un dessin fait sur un ecran etroit s'etalerait en
     largeur ici : les cercles deviendraient des ovales, et la moitie des
     dessins seraient impossibles a reconnaitre. */
  function frame(w, h){
    return frameFor(w, h, (scene && scene.ar) ? scene.ar : 0);
  }

  function frameFor(w, h, ar){
    if(!(ar > 0)) ar = w / h;
    var fw = w, fh = w / ar;
    if(fh > h){ fh = h; fw = h * ar; }
    return { x: (w - fw) / 2, y: (h - fh) / 2, w: fw, h: fh };
  }

  function schedulePaint(){
    if(painting) return;
    painting = true;
    requestAnimationFrame(function(){ painting = false; paintScene(); });
  }

  function sizeBoard(){
    if(!board || !board.parentNode) return false;
    var r = board.parentNode.getBoundingClientRect();
    /* LA DENSITE DE L'ECRAN, sinon le trait est flou : un telephone affiche
       deux a trois pixels physiques par pixel CSS, et un canvas dimensionne
       en pixels CSS se retrouve etire. Plafonnee a 2 — au-dela le gain ne se
       voit pas et le remplissage, qui parcourt les pixels un par un, coute
       deux fois plus cher. */
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(r.width * dpr));
    var h = Math.max(1, Math.round(Math.min(r.width * 1.25, window.innerHeight * 0.62) * dpr));
    if(board.width !== w || board.height !== h){
      board.width = w; board.height = h;
      board.style.height = Math.round(h / dpr) + 'px';
      committed.width = w; committed.height = h;
      /* La taille a change : tout ce qui etait fige l'etait a l'ancienne
         echelle. On refige. */
      sceneDone = 0;
      repaintDone();
    }
    return true;
  }

  /* Fige sur le calque hors ecran tous les elements sauf le dernier.
     POURQUOI CE CALQUE : un remplissage se calcule en parcourant les pixels
     un par un. Le rejouer a chaque image, soixante fois par seconde, ferait
     ramer le telephone pour un resultat rigoureusement identique. */
  function repaintDone(){
    if(!committed) return;
    var g = committed.getContext('2d');
    var f = frame(committed.width, committed.height);
    for(var i = sceneDone; i < sceneItems.length - 1; i++){
      drawItem(g, sceneItems[i], f, committed);
    }
    sceneDone = Math.max(0, sceneItems.length - 1);
  }

  function paintScene(){
    if(!sizeBoard()) return;
    repaintDone();
    var g = board.getContext('2d');
    g.clearRect(0, 0, board.width, board.height);
    g.drawImage(committed, 0, 0);
    if(sceneItems.length){
      drawItem(g, sceneItems[sceneItems.length - 1],
               frame(board.width, board.height), board);
    }
  }

  function drawItem(g, it, f, target){
    if(!it) return;
    if(it.t === 'f'){ floodFill(g, it, f, target); return; }
    var pts = parsePoints(it.p);
    if(!pts.length) return;
    g.save();
    /* LA GOMME CREUSE, elle ne peint pas en noir : le fond de l'ardoise ici
       est la page elle-meme, et un trait noir laisserait une trainee sombre
       la ou il devrait n'y avoir rien. C'est le pendant exact du
       `BlendMode.clear` cote application. */
    g.globalCompositeOperation = it.e ? 'destination-out' : 'source-over';
    g.strokeStyle = it.c || '#ffffff';
    g.fillStyle = it.c || '#ffffff';
    g.lineWidth = Math.max(1, (it.w || 0.01) * f.w);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    var X = function(i){ return f.x + pts[i][0] * f.w; };
    var Y = function(i){ return f.y + pts[i][1] * f.h; };
    if(pts.length === 1){
      g.beginPath();
      g.arc(X(0), Y(0), g.lineWidth / 2, 0, Math.PI * 2);
      g.fill();
      g.restore();
      return;
    }
    /* MEME LISSAGE QUE COTE APPLICATION — des quadratiques entre les milieux
       de segments. Relier les points a la regle donnerait un trait en dents
       de scie sur un trace rapide, et surtout un dessin qui ne ressemble pas
       a celui que le dessinateur a sous les yeux. */
    g.beginPath();
    g.moveTo(X(0), Y(0));
    for(var i = 1; i < pts.length - 1; i++){
      g.quadraticCurveTo(X(i), Y(i), (X(i) + X(i+1)) / 2, (Y(i) + Y(i+1)) / 2);
    }
    g.lineTo(X(pts.length - 1), Y(pts.length - 1));
    g.stroke();
    g.restore();
  }

  function parsePoints(p){
    if(!p) return [];
    var out = [], parts = p.split(' ');
    for(var i = 0; i < parts.length; i++){
      var c = parts[i].split(',');
      if(c.length !== 2) continue;
      var x = parseInt(c[0], 10), y = parseInt(c[1], 10);
      if(isNaN(x) || isNaN(y)) continue;
      out.push([x / 1000, y / 1000]);
    }
    return out;
  }

  /* LE POT DE PEINTURE, REJOUE.

     Le maitre nous a envoye l'endroit et la couleur, pas la zone : celle-ci
     n'a aucune description geometrique simple — c'est « tout ce qui est de
     la meme couleur et connexe ». On refait donc l'etalement ici, sur les
     memes traits, depuis le meme point. Le resultat n'est pas au pixel pres
     celui du telephone maitre (les deux ecrans n'ont pas la meme
     definition), et ça n'a aucune importance : c'est la meme zone. */
  function floodFill(g, it, f, target){
    var w = target.width, h = target.height;
    if(w < 2 || h < 2) return;
    var x0 = Math.round(f.x + (it.x / 1000) * f.w);
    var y0 = Math.round(f.y + (it.y / 1000) * f.h);
    if(x0 < 0 || y0 < 0 || x0 >= w || y0 >= h) return;
    var img, px;
    try {
      img = g.getImageData(0, 0, w, h);
      px = img.data;
    } catch(e){ return; }          // canvas souille : on renonce sans bruit

    var col = hexToRgb(it.c) || [255, 255, 255];
    var start = (y0 * w + x0) * 4;
    var sr = px[start], sg = px[start+1], sb = px[start+2], sa = px[start+3];
    /* Deja de la bonne couleur : sans cette sortie, l'etalement repeindrait
       a l'identique en parcourant toute la zone pour rien. */
    if(sa === 255 && sr === col[0] && sg === col[1] && sb === col[2]) return;

    var TOL = 28;                  // la meme tolerance que cote application
    var seen = new Uint8Array(w * h);
    var pile = [y0 * w + x0];
    seen[y0 * w + x0] = 1;
    while(pile.length){
      var idx = pile.pop();
      var o = idx * 4;
      px[o] = col[0]; px[o+1] = col[1]; px[o+2] = col[2]; px[o+3] = 255;
      var cx = idx % w, cy = (idx - cx) / w;
      var vois = [
        cx > 0 ? idx - 1 : -1,
        cx < w - 1 ? idx + 1 : -1,
        cy > 0 ? idx - w : -1,
        cy < h - 1 ? idx + w : -1
      ];
      for(var k = 0; k < 4; k++){
        var n = vois[k];
        /* MARQUE A L'EMPILEMENT, pas au depilement : sans ça un meme pixel
           entre quatre fois dans la pile, et une ardoise vide fait exploser
           la memoire avant d'avoir fini. */
        if(n < 0 || seen[n]) continue;
        var q = n * 4;
        if(Math.abs(px[q] - sr) > TOL || Math.abs(px[q+1] - sg) > TOL ||
           Math.abs(px[q+2] - sb) > TOL || Math.abs(px[q+3] - sa) > TOL) continue;
        seen[n] = 1;
        pile.push(n);
      }
    }
    g.putImageData(img, 0, 0);
  }

  function hexToRgb(h){
    if(typeof h !== 'string') return null;
    var m = /^#?([0-9a-f]{6})$/i.exec(h.trim());
    if(!m) return null;
    var v = parseInt(m[1], 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  /* LE PANNEAU DES REGLAGES.

     Il ne se reconstruit qu'a l'ouverture : rien dedans ne depend de l'etat
     du salon seconde par seconde, et le rebatir a chaque etat recu casserait
     le geste en cours, comme partout ailleurs sur cette page. */
  var panneauP = document.getElementById('param');
  var corpsP = document.getElementById('paramCorps');

  document.getElementById('reglages').onclick = function(){ ouvrirParam(); };
  document.getElementById('retourP').onclick = function(){ fermerParam(); };

  function ouvrirParam(){
    /* LE RETOUR DU TELEPHONE FERME LE PANNEAU, il ne quitte pas le salon.
       Meme mecanique que pour les cartes et la messagerie : sans elle, un
       invite qui ouvre les reglages en pleine partie et appuie sur retour
       sort de la page et doit refaire tout le parcours d'entree. */
    try{ history.pushState({ pivvy: 'param' }, ''); }catch(e){}
    corpsP.innerHTML = '';

    var t = el('div','card');
    t.appendChild(el('div','lbl','Apparence de cette page'));
    var wrap = el('div','themes');
    Object.keys(THEMES).forEach(function(name){
      var b = el('button',null,name.charAt(0).toUpperCase()+name.slice(1));
      b.onclick = function(){ applyTheme(name); };
      wrap.appendChild(b);
    });
    t.appendChild(wrap);
    corpsP.appendChild(t);

    /* « CE N'EST PAS MOI » N'A DE SENS QUE SI ON EST QUELQU'UN, et il est
       ici plutot que sous le nom du joueur : c'est un bouton d'abandon, il
       n'a rien a faire a portee de pouce pendant toute la soiree. */
    var tenu = myClaim || (state && state.claims && state.claims[dev]);
    if(tenu){
      var c = el('div','card');
      c.appendChild(el('div','lbl','Ce joueur'));
      c.appendChild(el('div','hint',
        'Rend ta place a la table : quelqu’un d’autre pourra la prendre.'));
      var q = el('button',null,'Ce n’est pas moi');
      q.onclick = function(){
        myClaim = null; S.removeItem(claimKey);
        intent('leave',{});
        fermerParam();
        render(1);
      };
      c.appendChild(q);
      corpsP.appendChild(c);
    }

    var info = el('div','card');
    info.appendChild(el('div','lbl','Cette page'));
    info.appendChild(el('div','hint','Version ' + PAGE_VERSION
      + (state && state.pv && state.pv !== PAGE_VERSION
          ? ' — le salon en attend une plus recente (' + state.pv + ').'
          : ' — a jour.')));
    if(CONFIG.mode !== 'lan'){
      info.appendChild(el('div','hint','Dernier envoi : ' + dernierEnvoi));
    }
    info.appendChild(el('div','hint','Appareil : ' + dev));
    corpsP.appendChild(info);

    panneauP.hidden = false;
  }

  /* `viaRetour` distingue les deux façons de refermer : le bouton fleche
     doit DEPILER l'entree d'historique qu'on a posee, le retour du telephone
     l'a deja depilee. Sans ça, chaque ouverture-fermeture laissait une entree
     derriere elle et il fallait appuyer cinq fois sur retour pour sortir. */
  function fermerParam(viaRetour){
    var etait = !panneauP.hidden;
    panneauP.hidden = true;
    if(etait && !viaRetour){
      try{ history.back(); }catch(e){}
    }
  }

  /* ------------------------------------------------------------------
     LE FORMULAIRE

     Un bloc de scene generique : le maitre decrit des champs, l'invite les
     remplit, et la reponse repart en une intention `act`. Le salon ne
     comprend rien a ce qu'il transporte — c'est la meme regle que pour les
     cartes, et c'est ce qui permet d'ajouter un jeu sans y toucher.

     `form.id` change a chaque manche : c'est lui qui distingue « je n'ai pas
     encore repondu » de « j'ai repondu ». Sans identifiant, la page ne
     saurait pas si le formulaire affiche est le meme qu'il y a dix secondes.
     ------------------------------------------------------------------ */
  var panneauF = document.getElementById('form');
  var corpsF = document.getElementById('corpsF');
  var titreF = document.getElementById('titreF');
  var formVu = null;        // l'identifiant du formulaire actuellement bati
  var formEnvoye = null;    // celui auquel on a deja repondu
  var formChamps = {};      // ce qui est saisi, pour survivre a un redessin
  var formBatiId = null;    // le dernier formulaire bati, meme referme depuis

  document.getElementById('retourF').onclick = function(){ fermerForm(); };

  /* LE FORMULAIRE EN COURS, PUBLIC OU PRIVE.
     Il peut etre prive, et pour le telephone arabe il DOIT l'etre : chacun
     recoit un maillon different, et deux invites qui verraient le meme
     n'auraient plus rien a deviner. On regarde donc d'abord la part chiffree
     qui nous est destinee — le meme mecanisme que les roles du Loup-Garou —
     puis, a defaut, le formulaire public, qui sert aux jeux ou tout le monde
     repond a la meme question (le petit bac).

     CETTE FONCTION EST PARTAGEE avec le rendu de `#app`, et c'est tout son
     interet : le bouton qui ouvre le panneau ne lisait QUE le formulaire
     public. Un formulaire prive etait donc bati, jamais montre, et sans
     `auto` il n'existait pour personne — le jeu entier restait a
     « 0 / 5 ont rendu ». */
  function formActuel(){
    var tenu = myClaim || (state && state.claims && state.claims[dev]);
    if(!tenu) return null;
    var mien = privee();
    if(mien && mien.form) return mien.form;
    return scene ? scene.form : null;
  }

  function majForm(){
    var f = formActuel();


    /* PLUS DE FORMULAIRE : on referme. Ça arrive quand la manche se termine
       ou que le jeu change, et l'invite ne doit pas rester devant des champs
       que plus personne n'attend. */
    if(!f || !f.id){
      /* LE DERNIER BROUILLON PART AVANT QU'ON REFERME. C'est le cas qui a
         motive tout ce mecanisme : le buzzer tombe, le maitre retire le
         formulaire, et ce qui etait ecrit doit compter. Le maitre accepte
         encore quelques secondes apres la fin de la manche, precisement
         pour ce paquet-la. */
      envoyerBrouillon();
      arreterBrouillon();
      if(!panneauF.hidden) fermerForm();
      formVu = null;
      // Le direct se coupe avec le formulaire : plus rien ne doit partir.
      liveId = null;
      if(liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
      return;
    }

    /* DEJA REPONDU : on ne repropose rien. On ne referme pas non plus tout
       seul si l'invite a rouvert le panneau — il a le droit de relire ce
       qu'il a envoye. */
    if(f.id === formEnvoye){
      if(!panneauF.hidden && formVu === f.id) majChronoForm(f);
      return;
    }

    if(formVu !== f.id){
      /* MEME RAISON QUE CI-DESSUS, mais pour l'enchainement : la manche
         suivante arrive, et la precedente n'a pas encore rendu sa fin. On
         vide AVANT de remettre `formChamps` a zero, sinon on enverrait une
         grille vide sous l'identifiant de la manche qui vient de finir. */
      envoyerBrouillon();
      arreterBrouillon();
      formVu = f.id;
      /* LE MEME FORMULAIRE QUI REVIENT garde ce qui etait tape : voir
         `batirForm`. */
      if(f.id !== formBatiId) formChamps = {};
      batirForm(f);
      if(f.auto) ouvrirForm();
    } else {
      majChronoForm(f);
      majWipeForm(f);
      majActesForm(f);
    }
  }

  /* LE MOT ET LES BOUTONS SUIVENT LE MAITRE, SANS RECONSTRUIRE LE PANNEAU.

     C'etait LE defaut de « trouvé » en dessin sur son telephone. Le panneau
     garde le meme identifiant pendant tout le tour (voir `majWipeForm`) :
     il n'etait donc bati qu'une fois, avec le PREMIER mot et les PREMIERS
     boutons. Apres un « trouvé », le maitre comptait bien le point et tirait
     le mot suivant — mais le panneau affichait toujours l'ancien mot, et le
     bouton, desarme par l'appui, le restait jusqu'a la fin du tour. Pour
     celui qui dessinait : rien ne s'etait passe, et son tour etait perdu.
     Pire, meme rearme, le bouton aurait renvoye l'ancien numero de mot, que
     le maitre rejette a juste titre.

     On compare donc ce que le maitre envoie a ce qui est affiche, et on ne
     remplace que ce qui a change : le mot, et la rangee de boutons. */
  var formBig = null;       // l'element du mot, dans le panneau
  var formActes = null;     // le conteneur des boutons, dans le panneau
  var formActesSig = '';    // ce qu'ils disent, pour ne les refaire qu'au besoin

  function majActesForm(f){
    if(formBig && f.big !== undefined && f.big !== null
       && formBig.textContent !== String(f.big)){
      formBig.textContent = String(f.big);
    }
    if(!formActes) return;
    var sig = JSON.stringify(f.actes || []);
    if(sig === formActesSig) return;
    formActesSig = sig;
    formActes.innerHTML = '';
    posActes(formActes, f.actes);
  }

  /* LE CHRONO SE MET A JOUR SANS RECONSTRUIRE LE FORMULAIRE. C'est tout
     l'interet de le tenir a part : un decompte qui redessine ses champs
     efface la frappe en cours. */
  /* LE TEMPS QUI RESTE, ECRIT COMME SUR LE TELEPHONE MAITRE.

     Il s'affichait « 90s » ici et « 1:30 » la-bas : le meme chrono, la meme
     partie, deux lectures. Et au-dela d'une minute, un nombre de secondes
     demande une division mentale — exactement au moment ou personne n'en a.
     Sous la minute on garde les secondes, qui se lisent d'un coup.
     Le jumeau Dart vit dans `lib/core/duree.dart`. */
  function tempsRestant(s){
    s = Math.max(0, s | 0);
    if(s < 60) return s + ' s';
    var r = s % 60;
    return (s / 60 | 0) + ':' + (r < 10 ? '0' + r : r);
  }

  function majChronoForm(f){
    /* LA DERNIERE SECONDE FORCE L'ENVOI.

       C'est une ceinture, la bretelle etant le vidage au retrait du
       formulaire (`majForm`). Les deux servent le meme cas — celui qui ecrit
       jusqu'au buzzer sans jamais quitter sa case ni appuyer sur le bouton —
       mais ils ne dependent pas de la meme chose : celui-ci ne demande que
       de voir le chrono tomber, celui-la demande de recevoir l'etat suivant.
       Le maitre accepte encore quelques secondes apres la fin de la manche,
       precisement pour ce paquet.

       ÇA RESTE UN BROUILLON (`d: 1`), et c'est important : si l'horloge du
       maitre a une seconde de retard sur celle-ci, la manche court encore et
       ce qu'on tape apres doit continuer de partir. C'est le BUZZER DU
       MAITRE qui rend les copies, pas cet envoi-ci. */
    if(f.left !== undefined && f.left !== null && f.left <= 1){
      envoyerBrouillon();
    }
    var c = document.getElementById('chronoF');
    if(!c) return;
    if(f.left === undefined || f.left === null){ c.textContent = ''; return; }
    c.textContent = tempsRestant(f.left);
    if(f.left <= 5){ c.className = 'chrono court'; } else { c.className = 'chrono'; }
  }

  /* ------------------------------------------------------------------
     L'ARDOISE DE L'INVITE

     Jusqu'ici le dessin allait dans un seul sens : le maitre tracait, les
     invites regardaient. Le telephone arabe demande l'inverse, et sur tous
     les telephones a la fois.

     CE QUI VOYAGE, CE SONT LES TRAITS, PAS L'IMAGE. Meme format que dans
     l'autre sens — des points en milliemes, une couleur, une epaisseur — et
     donc la meme regle du §8 : aucune image ne passe par le salon. Un dessin
     complet fait quelques kilo-octets de texte, ce qu'un canal de diffusion
     transporte sans broncher.
     ------------------------------------------------------------------ */
  var croquis = null;       // le canvas
  var traits = [];          // ce qui a ete trace
  var traitEnCours = null;
  var finDoigt = null;      // l'ecouteur `mouseup`, pour pouvoir le retirer
  var couleurC = '#ffffff';
  var epaisseurC = 0.019;
  var outilC = 'crayon';    // 'crayon' | 'pot' | 'gomme'

  /* LE ZOOM DE L'ARDOISE : deux doigts pincent et deplacent, un doigt
     dessine.

     IL NE TOUCHE QU'A LA VUE. Les points sont ramenes dans le repere de
     l'ardoise avant d'etre notes (`versArdoise`), et l'epaisseur reste une
     fraction de la largeur de l'ardoise : un trait fin pose a ×4 est fin sur
     le dessin, et ce qui part vers le maitre ne sait rien du zoom.
     `zoomC` va de 1 a 4 ; `panXC` / `panYC` sont le decalage de la vue, en
     fraction de la zone (de `1 - zoomC` a 0 : le dessin ne sort jamais du
     cadre). */
  var ZOOM_MAX = 4;
  var zoomC = 1, panXC = 0, panYC = 0;
  var zoomRaz = null;       // le bouton « ⤢ », visible seulement zoome

  function remettreZoom(){
    zoomC = 1; panXC = 0; panYC = 0;
    if(zoomRaz) zoomRaz.hidden = true;
  }

  /* Le decalage ne laisse jamais voir au-dela du dessin. */
  function bornerZoom(){
    zoomC = Math.max(1, Math.min(ZOOM_MAX, zoomC));
    panXC = Math.max(1 - zoomC, Math.min(0, panXC));
    panYC = Math.max(1 - zoomC, Math.min(0, panYC));
    if(zoomRaz) zoomRaz.hidden = !(zoomC > 1.01);
  }

  /* LA PALETTE ET LES EPAISSEURS VIENNENT DU MAITRE.

     POURQUOI ELLES NE SONT PLUS ECRITES ICI. Cette page avait sa propre
     liste de sept couleurs et une seule epaisseur ; le telephone maitre en
     a onze et trois. Meme jeu, meme ardoise, deux jeux d'outils — selon le
     telephone sur lequel on tombait, on pouvait remplir une zone ou pas.
     C'est la divergence habituelle entre deux copies : on enrichit l'une, et
     rien ne signale que l'autre est restee en arriere.

     Les valeurs ci-dessous ne servent donc que si le formulaire n'en porte
     pas — un jeu plus ancien, un maitre pas encore a jour. Voir
     `DrawingBoard.palette` et `DrawingBoard.relativeWidths`. */
  var PALETTE_DEFAUT = ['#ffffff', '#9AA3B2', '#1B1F2A', '#FF5D5D', '#FF8A3D',
                        '#FFD24A', '#4FD68A', '#2BE8C5', '#5B9BFF', '#B07BFF',
                        '#FF8ECF'];
  var EPAISSEURS_DEFAUT = [0.008, 0.019, 0.05];
  var PALETTE = PALETTE_DEFAUT;
  var EPAISSEURS = EPAISSEURS_DEFAUT;
  var epaisseurIdx = 1;

  /* LA GOMME EST PLUS LARGE QUE LE CRAYON, du meme facteur que sur le
     telephone maitre : on efface par zones, pas au trait. */
  var GOMME_FACTEUR = 2.2;

  /* L'ARDOISE QUI PART EN DIRECT (« Mime ou Dessine »).

     Le telephone arabe rend son dessin UNE FOIS, a la fin : le panneau garde
     donc tout pour lui jusqu'au bouton. Ici c'est l'inverse — la table
     regarde le trait se faire, sur le telephone principal et sur les autres.
     Un dessin qui n'arriverait qu'au coup de sifflet n'aurait aucun sens :
     le mot est a deviner PENDANT.

     LE DERNIER ENVOI EST GARANTI, et c'est tout l'interet de la minuterie :
     un simple « pas plus d'une fois par tranche » laisse tomber la fin du
     geste — on leve le doigt, et les derniers points ne partent jamais. Le
     dessin reste ampute sur tous les autres ecrans, et celui qui dessine ne
     peut pas le savoir. */
  var liveId = null;        // l'identifiant du tour diffuse, ou null
  var liveAt = 0;
  var liveTimer = null;
  var LIVE_ECART = 120;

  function diffuserCroquis(){
    if(!liveId) return;
    function envoyer(){
      liveAt = Date.now();
      liveTimer = null;
      /* LE MOT, PAS SEULEMENT LE TOUR : `liveId` ne change pas entre deux
         mots. Sans ce compteur, un paquet parti juste avant « trouve ! »
         arrive apres l'effacement et repose le dessin precedent sous le mot
         suivant. Le maitre le rejette sur cette valeur. */
      intent('act', { a: 'croquis', f: liveId, w: wipeVu, it: traits });
    }
    if(liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
    var reste = LIVE_ECART - (Date.now() - liveAt);
    if(reste <= 0){ envoyer(); return; }
    liveTimer = setTimeout(envoyer, reste);
  }

  /* LE MOT SUIVANT EFFACE L'ARDOISE SANS FERMER LE PANNEAU.

     On aurait pu changer l'identifiant du formulaire a chaque mot : le
     panneau se serait referme et rouvert tout seul. Mais c'est une seconde
     d'animation en plein chrono, a chaque mot trouve, sur le telephone de
     celui qui joue. Un compteur suffit. */
  var wipeVu = null;

  function majWipeForm(f){
    if(f.wipe === undefined || f.wipe === wipeVu) return;
    /* ON NE NOTE L'EFFACEMENT QU'APRES L'AVOIR FAIT. Note avant le garde,
       un effacement arrive alors qu'aucune ardoise n'existe encore passait
       pour applique, et le suivant ne venait jamais. */
    if(!croquis) return;
    wipeVu = f.wipe;
    traits = [];
    traitEnCours = null;
    /* Le mot suivant repart du cadre entier. */
    remettreZoom();
    peindreCroquis();
  }

  function batirCroquis(f, hote){
    traits = [];
    traitEnCours = null;
    croquisFait = null;   // le calque appartient a l'ardoise precedente

    /* LES OUTILS DU MAITRE, s'il les a envoyes. Voir `PALETTE_DEFAUT`. */
    PALETTE = (f.palette && f.palette.length) ? f.palette : PALETTE_DEFAUT;
    EPAISSEURS = (f.epaisseurs && f.epaisseurs.length)
      ? f.epaisseurs : EPAISSEURS_DEFAUT;
    epaisseurIdx = Math.min(1, EPAISSEURS.length - 1);
    epaisseurC = EPAISSEURS[epaisseurIdx];
    couleurC = PALETTE[0];
    outilC = 'crayon';
    zoomRaz = null;
    remettreZoom();
    masquesC = [];
    croquisZ = null;

    croquis = document.createElement('canvas');
    croquis.className = 'croquis';
    var cadre = el('div','ardoise-invite');
    /* LE FOND EST CELUI DU THEME DE CET INVITE, un peu eclairci — voir
       `fondArdoiseInvite`. Le `fond` du formulaire (le theme du maitre)
       n'est plus pris : chacun dessine dans ses couleurs. */
    var zone = el('div','ardoise-zone');
    zone.style.background = fondArdoiseInvite();
    zone.appendChild(croquis);
    cadre.appendChild(zone);
    hote.appendChild(cadre);

    /* LA PALETTE, PAR-DESSUS L'ARDOISE ET DERRIERE UNE PASTILLE.

       Elle defilait sur sa propre rangee, sous l'ardoise : une ligne entiere
       prise au dessin, pour un choix qu'on fait trois fois par tour. La
       pastille, dans la rangee des outils, montre la couleur courante ; la
       palette complete s'ouvre sur le bas de l'ardoise et se referme des
       qu'on a choisi. Le doigt qui la referme sans choisir ne trace rien :
       elle est posee AU-DESSUS du canevas, qui ne recoit pas la touche. */
    var pop = el('div','palette-pop');
    pop.hidden = true;
    PALETTE.forEach(function(c){
      var b = document.createElement('button');
      b.className = 'pot';
      b.style.background = c;
      b.setAttribute('data-c', c);
      b.onclick = function(){
        couleurC = c;
        /* CHOISIR UNE COULEUR SORT DE LA GOMME : personne ne choisit une
           couleur pour effacer. Meme regle que sur le telephone maitre. */
        if(outilC === 'gomme') outilC = 'crayon';
        pop.hidden = true;
        majPots();
      };
      pop.appendChild(b);
    });
    zone.appendChild(pop);

    /* « ⤢ » : retour au cadre entier. Sur l'ardoise, et seulement zoome —
       c'est la qu'on regarde a ce moment-la, et la rangee d'outils est deja
       pleine a 360 px. Le double appui a deux doigts fait la meme chose. */
    zoomRaz = el('button','outil zoomRaz','⤢');
    zoomRaz.title = 'Revenir au dessin entier';
    zoomRaz.hidden = true;
    zoomRaz.onclick = function(){ remettreZoom(); peindreCroquis(); };
    zone.appendChild(zoomRaz);

    var barre = el('div','outils');

    var pastilleC = el('button','outil couleur');
    pastilleC.title = 'Couleurs';
    pastilleC.appendChild(el('i'));
    pastilleC.onclick = function(){ pop.hidden = !pop.hidden; };
    barre.appendChild(pastilleC);

    function outil(cle, texte, titre){
      var b = el('button','outil', texte);
      b.setAttribute('data-o', cle);
      b.title = titre || '';
      b.onclick = function(){
        outilC = cle;
        majPots();
      };
      barre.appendChild(b);
      return b;
    }
    outil('crayon', '✏️', 'Crayon');
    outil('pot', '🪣', 'Pot de peinture');
    outil('gomme', '🩹', 'Gomme');

    /* L'EPAISSEUR TOURNE SUR TROIS CRANS, comme sur le telephone maitre : un
       point dont la taille montre le cran qu'on a. Trois valeurs ne valent
       pas un menu. */
    var epais = el('button','outil epais');
    epais.appendChild(el('i','rond'));
    epais.onclick = function(){
      epaisseurIdx = (epaisseurIdx + 1) % EPAISSEURS.length;
      epaisseurC = EPAISSEURS[epaisseurIdx];
      majPots();
    };
    barre.appendChild(epais);

    var annuler = el('button','outil fin','↶');
    annuler.onclick = function(){
      traits.pop();
      peindreCroquis();
      diffuserCroquis();
    };
    barre.appendChild(annuler);
    var vider = el('button','outil','🗑');
    vider.onclick = function(){
      traits = [];
      peindreCroquis();
      diffuserCroquis();
    };
    barre.appendChild(vider);
    hote.appendChild(barre);
    majPots();

    brancherDoigt(f);
    // Le canvas n'a sa taille qu'une fois dans le document.
    setTimeout(peindreCroquis, 0);
    window.addEventListener('resize', peindreCroquis);
  }

  function majPots(){
    /* La pastille qui ouvre la palette porte la couleur courante. */
    var pastilleC = document.querySelector('#form .outil.couleur i');
    if(pastilleC) pastilleC.style.background = couleurC;
    var pots = document.querySelectorAll('#form .pot');
    for(var i = 0; i < pots.length; i++){
      pots[i].className =
        (pots[i].getAttribute('data-c') === couleurC && outilC !== 'gomme')
          ? 'pot actif' : 'pot';
    }
    var outils = document.querySelectorAll('#form .outil[data-o]');
    for(var j = 0; j < outils.length; j++){
      outils[j].className = outils[j].getAttribute('data-o') === outilC
        ? 'outil actif' : 'outil';
    }
    /* LE POINT D'EPAISSEUR MONTRE LE CRAN. On le dimensionne d'apres la
       valeur elle-meme, pas d'apres l'indice : trois crans aujourd'hui, un
       autre nombre demain, et rien a retoucher ici. */
    var rond = document.querySelector('#form .epais .rond');
    if(rond){
      var taille = Math.round(6 + epaisseurC * 200);
      rond.style.width = taille + 'px';
      rond.style.height = taille + 'px';
    }
  }

  function cadreCroquis(){
    return frameFor(croquis.width, croquis.height, ARDOISE);
  }

  /* LES PROPORTIONS DE L'ARDOISE SONT FIXEES ICI, ET C'EST NECESSAIRE.
     Un dessin fait sur un telephone etroit et rejoue sur un ecran large
     s'etalerait : les cercles deviendraient des ovales et la moitie des
     dessins seraient impossibles a reconnaitre. Tout le monde dessine donc
     dans le meme rectangle, quelle que soit la taille de son ecran. */
  var ARDOISE = 0.75;

  /* LES DOIGTS, EN EVENEMENTS « POINTER » ET PLUS « TOUCH » / « MOUSE ».

     Le zoom demande de savoir COMBIEN de doigts sont poses, et lesquels :
     les evenements tactiles ne donnaient que « le premier », et un second
     doigt se lisait comme un saut du premier — un trait parasite en travers
     du dessin. Ici chaque pointeur a son identifiant, souris comprise.

     LA REGLE : le geste commence au premier doigt pose et finit au dernier
     leve. Un doigt seul dessine. Des qu'un second se pose, le geste devient
     un pincement JUSQU'AU BOUT : le trait commence est retire s'il venait de
     naitre (c'etait le premier doigt du pincement), arrete la ou il en est
     s'il etait deja long ; et le doigt qui reste apres le pincement ne
     dessine pas. Le pot ne se verse qu'au lever, s'il n'y a pas eu de second
     doigt — sinon chaque zoom, pot en main, peignait une zone. */
  var doigts = {};          // identifiant -> [x, y] en pixels CSS de l'ecran
  var nDoigts = 0;
  var gestePince = false;   // un second doigt est venu pendant ce geste
  var potEnAttente = null;  // [x, y] en milliemes, verse au lever
  var traitNeA = 0;
  var pince = null;         // le repere du pincement
  var pinceDebut = 0, pinceBouge = false, dernierTape2 = 0;
  var peintureDemandee = false;

  /* Une peinture par image au plus pendant un pincement : un doigt produit
     plus d'evenements que l'ecran n'affiche d'images. */
  function demanderPeinture(){
    if(peintureDemandee) return;
    peintureDemandee = true;
    requestAnimationFrame(function(){
      peintureDemandee = false;
      peindreCroquis();
    });
  }

  /* Pixel de l'ecran -> point de l'ardoise, en milliemes, zoom compris. */
  function versArdoise(x, y){
    var r = croquis.getBoundingClientRect();
    var vx = r.width ? (x - r.left) / r.width : 0;
    var vy = r.height ? (y - r.top) / r.height : 0;
    var bx = (vx - panXC) / zoomC;
    var by = (vy - panYC) / zoomC;
    return [Math.round(Math.max(0, Math.min(1, bx)) * 1000),
            Math.round(Math.max(0, Math.min(1, by)) * 1000)];
  }

  function deuxDoigts(){
    var out = [];
    for(var k in doigts){
      if(doigts.hasOwnProperty(k)){ out.push(doigts[k]); if(out.length === 2) break; }
    }
    return out;
  }

  function reperePince(){
    var d = deuxDoigts();
    if(d.length < 2){ pince = null; return; }
    var r = croquis.getBoundingClientRect();
    pince = {
      z: zoomC, px: panXC, py: panYC,
      fx: ((d[0][0] + d[1][0]) / 2 - r.left) / (r.width || 1),
      fy: ((d[0][1] + d[1][1]) / 2 - r.top) / (r.height || 1),
      ecart: Math.max(1, Math.hypot(d[0][0] - d[1][0], d[0][1] - d[1][1]))
    };
  }

  function suivrePince(){
    var d = deuxDoigts();
    if(!pince || d.length < 2) return;
    var r = croquis.getBoundingClientRect();
    var fx = ((d[0][0] + d[1][0]) / 2 - r.left) / (r.width || 1);
    var fy = ((d[0][1] + d[1][1]) / 2 - r.top) / (r.height || 1);
    var ecart = Math.max(1, Math.hypot(d[0][0] - d[1][0], d[0][1] - d[1][1]));
    zoomC = Math.max(1, Math.min(ZOOM_MAX, pince.z * ecart / pince.ecart));
    /* LE POINT PINCE RESTE SOUS LES DOIGTS : sans ce recalage, zoomer
       ramene le dessin vers le coin haut-gauche. */
    var k = zoomC / pince.z;
    panXC = fx - (pince.fx - pince.px) * k;
    panYC = fy - (pince.fy - pince.py) * k;
    bornerZoom();
    if(Math.abs(zoomC - pince.z) > 0.05
       || Math.abs(fx - pince.fx) * r.width > 12
       || Math.abs(fy - pince.fy) * r.height > 12) pinceBouge = true;
    demanderPeinture();
  }

  /* Le second doigt est arrive pendant un trait. */
  function arreterTraitPourPince(){
    var t = traitEnCours;
    traitEnCours = null;
    if(!t || traits[traits.length - 1] !== t) return;
    var jeune = Date.now() - traitNeA < 350;
    if(jeune || t.p.split(' ').length <= 3){
      traits.pop();
      peindreCroquis();
    }
    diffuserCroquis();
  }

  function brancherDoigt(f){
    function debut(ev){
      ev.preventDefault();
      if(ev.pointerType === 'mouse' && ev.button !== 0) return;
      try { croquis.setPointerCapture(ev.pointerId); } catch(e){}
      if(!doigts.hasOwnProperty(ev.pointerId)) nDoigts++;
      doigts[ev.pointerId] = [ev.clientX, ev.clientY];
      if(nDoigts === 1){
        gestePince = false;
        potEnAttente = null;
        traitEnCours = null;
        var p = versArdoise(ev.clientX, ev.clientY);
        /* LE POT N'EST PAS UN TRACE : un point de depart et une couleur,
           jamais une image — le format que le maitre envoie et que cette
           page sait rejouer (`floodFill`). Verse au lever, voir plus haut. */
        if(outilC === 'pot'){ potEnAttente = p; return; }
        var gomme = outilC === 'gomme';
        traitEnCours = { t: 's',
                         w: gomme ? epaisseurC * GOMME_FACTEUR : epaisseurC,
                         p: p[0] + ',' + p[1] };
        /* `e` OU `c`, JAMAIS LES DEUX : c'est l'encodage que le maitre
           attend (voir `encodeBoard`). Une gomme qui porterait une couleur
           peindrait un trait sombre au lieu de creuser. */
        if(gomme){ traitEnCours.e = 1; } else { traitEnCours.c = couleurC; }
        traitNeA = Date.now();
        traits.push(traitEnCours);
        peindreCroquis();
        diffuserCroquis();
        return;
      }
      if(!gestePince){
        gestePince = true;
        pinceDebut = Date.now();
        pinceBouge = false;
        potEnAttente = null;
        arreterTraitPourPince();
      }
      reperePince();
    }
    function bouge(ev){
      if(!doigts.hasOwnProperty(ev.pointerId)) return;
      ev.preventDefault();
      doigts[ev.pointerId] = [ev.clientX, ev.clientY];
      if(gestePince){ if(nDoigts >= 2) suivrePince(); return; }
      if(!traitEnCours) return;
      var p = versArdoise(ev.clientX, ev.clientY);
      /* ON NE GARDE PAS TOUS LES POINTS. Un doigt en produit soixante par
         seconde ; a deux points par pixel le trait ne change pas d'aspect et
         le message triple de taille. On saute ce qui n'a pas bouge — un
         seuil plus fin quand on a zoome, sinon le zoom ne servirait a rien
         pour les details. */
      var q = traitEnCours.p.split(' ');
      var d = q[q.length - 1].split(',');
      var seuil = Math.max(1, Math.round(6 / zoomC));
      if(Math.abs(p[0] - d[0]) + Math.abs(p[1] - d[1]) < seuil) return;
      traitEnCours.p += ' ' + p[0] + ',' + p[1];
      peindreCroquis();
      diffuserCroquis();
    }
    /* UN DOIGT SE LEVE. Le dernier termine le geste et force le dernier
       envoi : sans lui, la fin du trait attend le prochain geste — et si
       c'etait le dernier, elle n'arrive jamais. */
    function fin(ev){
      if(!doigts.hasOwnProperty(ev.pointerId)) return;
      delete doigts[ev.pointerId];
      nDoigts = Math.max(0, nDoigts - 1);
      if(nDoigts > 0){
        if(gestePince && nDoigts >= 2) reperePince();
        return;
      }
      var pot = potEnAttente;
      potEnAttente = null;
      traitEnCours = null;
      pince = null;
      if(gestePince){
        /* DEUX DOIGTS TAPES DEUX FOIS : retour au cadre entier. */
        var maintenant = Date.now();
        if(!pinceBouge && maintenant - pinceDebut < 320){
          if(maintenant - dernierTape2 < 450){
            dernierTape2 = 0;
            remettreZoom();
            peindreCroquis();
          } else {
            dernierTape2 = maintenant;
          }
        } else {
          dernierTape2 = 0;
        }
        gestePince = false;
        return;
      }
      if(pot && ev.type === 'pointerup'){
        traits.push({ t: 'f', c: couleurC, x: pot[0], y: pot[1] });
        peindreCroquis();
      }
      diffuserCroquis();
    }
    doigts = {};
    nDoigts = 0;
    gestePince = false;
    finDoigt = null;

    croquis.addEventListener('pointerdown', debut);
    croquis.addEventListener('pointermove', bouge);
    croquis.addEventListener('pointerup', fin);
    croquis.addEventListener('pointercancel', fin);
    /* Sans ceci, un appui long ouvre le menu « enregistrer l'image ». */
    croquis.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
  }

  /* Une ardoise en lecture seule : le maillon qu'on doit interpreter.

     DEUX TAILLES. Dans un formulaire ordinaire, elle prend la largeur et la
     hauteur qui va avec. Dans un formulaire a saisie (telephone arabe, voir
     `#form.vue`), c'est sa BOITE qui decide : elle prend la hauteur que le
     clavier laisse, et le dessin s'y inscrit, plus petit mais entier. */
  var vueCourante = null;

  function peindreVue(cv, items, fond){
    if(!cv.parentNode) return;
    /* UNE VUE RETIREE DU DOCUMENT NE SE REPEINT PLUS : sans ce test, l'attente
       ci-dessous tournait pour toujours sur un canevas mort. */
    if(!document.body.contains(cv)) return;
    var boite = cv.parentNode;
    var r = boite.getBoundingClientRect();
    if(r.width < 2){ setTimeout(function(){ peindreVue(cv, items, fond); }, 60); return; }
    var souple = /(^| )vue( |$)/.test(boite.className);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var hCss = souple ? Math.max(40, r.height)
                      : Math.min(r.width / ARDOISE, window.innerHeight * 0.45);
    var w = Math.max(1, Math.round(r.width * dpr));
    var h = Math.max(1, Math.round(hCss * dpr));
    cv.width = w; cv.height = h;
    if(!souple) cv.style.height = Math.round(h / dpr) + 'px';
    var g = cv.getContext('2d');
    g.clearRect(0, 0, w, h);
    var c = frameFor(w, h, ARDOISE);
    /* LES MARGES AUTOUR DU CADRE SONT PEINTES, et c'est un mur : un pot de
       peinture rejoue ici s'etale sur ce qui est TRANSPARENT et qui touche.
       Dans une boite large et basse (clavier ouvert), l'aplat d'un ciel
       debordait sinon sur les deux cotes du dessin. De la couleur du fond,
       le mur ne se voit pas. */
    if(fond){
      g.fillStyle = fond;
      g.fillRect(0, 0, w, c.y);
      g.fillRect(0, c.y + c.h, w, h - c.y - c.h);
      g.fillRect(0, 0, c.x, h);
      g.fillRect(c.x + c.w, 0, w - c.x - c.w, h);
    }
    for(var i = 0; i < items.length; i++){
      drawItem(g, items[i], c, cv);
    }
    if(souple){
      g.save();
      g.strokeStyle = 'rgba(255,255,255,.18)';
      g.lineWidth = 1;
      g.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);
      g.restore();
    }
  }

  /* LE CLAVIER CHANGE LA HAUTEUR VISIBLE : la vue suit. `resize` sur la
     fenetre ne part pas toujours (Chrome Android ne redimensionne que la
     zone visible), d'ou `visualViewport`. */
  function repeindreVue(){
    if(!vueCourante || panneauF.hidden) return;
    peindreVue(vueCourante.cv, vueCourante.items, vueCourante.fond);
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){
      setTimeout(repeindreVue, 30);
    });
  }
  window.addEventListener('resize', repeindreVue);

  /* LE CALQUE DEJA PEINT, et pourquoi il a fallu en passer par la.

     Repeindre l'ardoise entiere a chaque point du doigt marchait tant qu'il
     n'y avait que des traits. Le pot de peinture change tout : un
     remplissage se REJOUE — on relit l'image, on etale, on la repose — ce
     qui coute des centaines de milliers de pixels a chaque fois. Trois
     aplats posees, et le doigt trainait derriere le trait.

     Meme remede que pour l'ardoise du salon (`repaintDone`) : tout ce qui
     est fini est peint UNE FOIS sur un calque hors ecran, et seul l'element
     en cours se repeint. Le calque se refait quand la liste RETRECIT —
     annulation, effacement — parce qu'on ne peut pas retirer ce qu'on a
     deja peint. */
  var croquisFait = null;
  var croquisFaitN = 0;
  var croquisEssais = 0;

  /* LE ZOOM REDESSINE, IL N'ETIRE PAS. Agrandir le calque deja peint
     donnerait des traits flous, justement la ou l'on zoome pour etre precis.
     Zoome, on repeint donc les traits a la bonne echelle, sur un second
     calque (`croquisZ`), refait seulement quand la vue change.

     LES REMPLISSAGES NE SE REJOUENT PAS ZOOMES : l'etalement ne verrait que
     la partie visible, et une zone reliee par un bord hors de vue resterait
     vide. Chacun est calcule sur l'ardoise entiere (le calque a l'echelle 1),
     et on en garde le MASQUE — les pixels qu'il a changes — qu'on pose,
     agrandi, a sa place dans l'ordre des traits. Seuls les bords d'un aplat
     sont donc un peu doux au zoom ; les traits restent nets. */
  var masquesC = [];        // indice de l'element -> canvas du remplissage
  var croquisZ = null;
  var croquisZCle = '';
  var croquisZN = 0;
  var croquisGen = 0;       // change quand le calque a l'echelle 1 repart de zero

  /* Pose un remplissage sur le calque a l'echelle 1, et en garde le masque. */
  function remplirEtRetenir(gf, it, c, i){
    var w = croquisFait.width, h = croquisFait.height, avant, apres;
    try { avant = gf.getImageData(0, 0, w, h); } catch(e){ avant = null; }
    drawItem(gf, it, c, croquisFait);
    if(!avant) return;
    try { apres = gf.getImageData(0, 0, w, h); } catch(e){ return; }
    var m = document.createElement('canvas');
    m.width = w; m.height = h;
    var gm = m.getContext('2d');
    var img = gm.createImageData(w, h);
    var a = avant.data, b = apres.data, o = img.data;
    for(var k = 0; k < b.length; k += 4){
      if(a[k] !== b[k] || a[k+1] !== b[k+1] || a[k+2] !== b[k+2]
         || a[k+3] !== b[k+3]){
        o[k] = b[k]; o[k+1] = b[k+1]; o[k+2] = b[k+2]; o[k+3] = b[k+3];
      }
    }
    gm.putImageData(img, 0, 0);
    masquesC[i] = m;
  }

  /* Le cadre du dessin tel que la vue zoomee le montre. */
  function cadreZoom(w, h){
    return { x: panXC * w, y: panYC * h, w: w * zoomC, h: h * zoomC };
  }

  function dessinerZoome(g, it, i, cz){
    if(!it) return;
    if(it.t === 'f'){
      var m = masquesC[i];
      if(m) g.drawImage(m, cz.x, cz.y, cz.w, cz.h);
      return;
    }
    drawItem(g, it, cz, croquisZ);
  }

  /* LE FOND DE L'ARDOISE DE CET INVITE : son theme a lui, un peu eclairci.

     C'etait le theme du MAITRE (le `fond` du formulaire) : on dessinait
     chez soi sur une couleur qu'on n'avait pas choisie. Meme recette que
     `ChainColors.ardoise` cote application — un point entre les deux
     premieres couleurs du degrade, puis 22 % de blanc. L'eclaircissement
     n'est pas decoratif : sur les themes les plus sombres (neon, minuit),
     le « noir » de la palette disparaissait sur le fond ; eclairci, il se
     voit, et le blanc et les couleurs vives ressortent toujours. Le maitre
     repeint les traits sur SON ardoise, faite de la meme recette : ce qui
     est lisible ici l'est la-bas. */
  function fondArdoiseInvite(){
    var st = getComputedStyle(document.documentElement);
    function rgb(v, defaut){
      var m = /^#?([0-9a-f]{6})$/i.exec((v || '').trim());
      var n = parseInt(m ? m[1] : defaut, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    var a = rgb(st.getPropertyValue('--bg1'), '0A1436');
    var b = rgb(st.getPropertyValue('--bg2'), '16409B');
    var out = [];
    for(var i = 0; i < 3; i++){
      var c = a[i] + (b[i] - a[i]) * 0.42;
      out.push(Math.round(c + (255 - c) * 0.22));
    }
    return 'rgb(' + out.join(',') + ')';
  }

  function peindreCroquis(){
    if(!croquis || !croquis.parentNode) return;
    var zone = croquis.parentNode;
    var boite = zone.parentNode;
    if(!boite || !document.body.contains(croquis)) return;
    var r = boite.getBoundingClientRect();
    /* Pas encore mis en page (panneau qui s'ouvre) : on repassera — un
       nombre de fois BORNE, un panneau ferme n'ayant jamais de taille. */
    if(r.width < 2){
      if(croquisEssais++ < 20) setTimeout(peindreCroquis, 60);
      return;
    }
    croquisEssais = 0;
    /* LA ZONE PREND TOUTE LA LARGEUR, et la hauteur qui va avec ses
       proportions. Plafond : 86 % de la hauteur visible, pour qu'un
       telephone couche ne donne pas une ardoise plus haute que l'ecran.
       La boite prend la hauteur de la zone : le panneau defile si les
       boutons ne tiennent plus dessous — c'est le choix du joueur. */
    var visible = (window.visualViewport && window.visualViewport.height)
                  || window.innerHeight;
    var zw = Math.min(r.width, Math.max(120, visible * 0.86) * ARDOISE);
    var zh = zw / ARDOISE;
    boite.style.height = Math.round(zh) + 'px';
    zone.style.width = Math.round(zw) + 'px';
    zone.style.height = Math.round(zh) + 'px';
    zone.style.left = Math.round((r.width - zw) / 2) + 'px';
    zone.style.top = '0px';
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(zw * dpr));
    var h = Math.max(1, Math.round(zh * dpr));
    if(croquis.width !== w || croquis.height !== h){
      croquis.width = w; croquis.height = h;
    }
    if(!croquisFait || croquisFait.width !== w || croquisFait.height !== h){
      croquisFait = document.createElement('canvas');
      croquisFait.width = w; croquisFait.height = h;
      croquisFaitN = -1;
    }
    var c = cadreCroquis();
    var gf = croquisFait.getContext('2d');
    /* CE QUI EST FINI. Tout sauf le dernier element — et le dernier aussi
       si c'est un remplissage : il ne bougera plus, et c'est sur ce calque
       qu'il doit etre calcule pour qu'on en ait le masque. */
    var n = traits.length;
    var cible = (n && traits[n - 1].t === 'f') ? n : Math.max(0, n - 1);
    /* LE CALQUE A TROP DE CHOSES DESSUS : on repart de zero. C'est le cas de
       l'annulation et de l'effacement, et le seul ou l'on paie le prix fort
       — une fois, sur un geste explicite, jamais en plein trace. */
    if(croquisFaitN < 0 || croquisFaitN > cible){
      gf.clearRect(0, 0, w, h);
      croquisFaitN = 0;
      masquesC = [];
      croquisGen++;
    }
    for(; croquisFaitN < cible; croquisFaitN++){
      if(traits[croquisFaitN].t === 'f'){
        remplirEtRetenir(gf, traits[croquisFaitN], c, croquisFaitN);
      } else {
        drawItem(gf, traits[croquisFaitN], c, croquisFait);
      }
    }

    var g = croquis.getContext('2d');
    g.clearRect(0, 0, w, h);
    if(!(zoomC > 1.001)){
      g.drawImage(croquisFait, 0, 0);
      if(cible < n) drawItem(g, traits[n - 1], c, croquis);
      return;
    }
    /* ZOOME : le calque redessine a l'echelle de la vue. */
    var cz = cadreZoom(w, h);
    var cle = [w, h, zoomC, panXC, panYC, croquisGen].join('|');
    if(!croquisZ || croquisZCle !== cle || croquisZN > cible){
      if(!croquisZ){ croquisZ = document.createElement('canvas'); }
      croquisZ.width = w; croquisZ.height = h;
      croquisZCle = cle;
      croquisZN = 0;
    }
    var gz = croquisZ.getContext('2d');
    for(; croquisZN < cible; croquisZN++){
      dessinerZoome(gz, traits[croquisZN], croquisZN, cz);
    }
    g.drawImage(croquisZ, 0, 0);
    if(cible < n) drawItem(g, traits[n - 1], cz, croquis);
    /* PLUS DE FILET DANS LE CANEVAS : le bord est celui de `.ardoise-zone`,
       dehors, et ne peut donc pas servir de mur a un remplissage. */
  }

  /* ------------------------------------------------------------------
     LE BROUILLON : CE QUI EST ECRIT PART, MEME SANS LE BOUTON.

     POURQUOI CE CODE EXISTE. Au petit bac, quelqu'un a rempli ses six
     categories, n'a pas appuye sur « rendre ma copie » avant le buzzer, et a
     fini la manche a zero point. Rien de ce qu'il avait ecrit n'avait jamais
     quitte son telephone : la grille etait complete, sous ses yeux, et
     invisible pour tout le monde d'autre.

     Le bouton reste — il ferme le panneau et dit « j'ai fini », ce qui
     avance la manche quand tout le monde a rendu. Mais ne pas l'avoir presse
     ne coute plus rien : la grille est deja partie, ligne apres ligne.

     TROIS PRECAUTIONS.
     - `d: 1` marque le brouillon. Sans lui le maitre croirait la copie
       rendue des la premiere lettre tapee, et fermerait la manche au nez des
       autres des que le dernier joueur aurait effleure son clavier.
     - ON N'ENVOIE QUE CE QUI A CHANGE. La comparaison porte sur la grille
       entiere serialisee : une frappe qui ne change rien — une fleche, un
       clic dans le champ — ne coute pas un message.
     - UN SEUL ENVOI PAR SECONDE AU PLUS, et le dernier est garanti : la
       minuterie est relancee a chaque frappe, jamais annulee sans etre
       rejouee. Un « au plus une fois par tranche » tout simple perdrait
       precisement la fin de la saisie, c'est-a-dire le seul moment qui
       compte.
     ------------------------------------------------------------------ */
  var brouillonId = null;
  var brouillonChamps = [];
  var brouillonTimer = null;
  var brouillonEnvoye = '';
  var BROUILLON_ECART = 900;

  /* LE NUMERO DE VERSION DE LA GRILLE (`r`), sur chaque brouillon et chaque
     copie. Depuis qu'on peut MODIFIER une copie rendue, l'ordre d'arrivee ne
     dit plus laquelle est la bonne : la boite d'envoi peut relivrer la
     premiere copie apres la seconde, et les brouillons d'une copie rouverte
     sont legitimes. Le maitre garde la plus haute (`_Copie.rev`). L'horloge
     sert de base pour que le compte ne reparte pas en arriere apres un
     rechargement de la page ; le `+ 1` le garde croissant a la milliseconde
     pres. */
  var formRev = 0;
  function revSuivante(){
    formRev = Math.max(formRev + 1, Date.now());
    return formRev;
  }

  /* La grille telle qu'elle partirait maintenant. */
  function grilleBrouillon(){
    var v = {};
    brouillonChamps.forEach(function(ch){
      v[ch.k] = (formChamps[ch.k] || '').trim();
    });
    return v;
  }

  function planifierBrouillon(){
    if(!brouillonId || brouillonTimer) return;
    brouillonTimer = setTimeout(function(){
      brouillonTimer = null;
      envoyerBrouillon();
    }, BROUILLON_ECART);
  }

  /* Envoie tout de suite, si quelque chose a change. Appele aussi quand on
     quitte un champ et quand le formulaire disparait — le dernier mot tape
     avant le buzzer doit partir, meme si la minuterie n'a pas encore rendu
     la main. */
  function envoyerBrouillon(){
    if(brouillonTimer){ clearTimeout(brouillonTimer); brouillonTimer = null; }
    if(!brouillonId) return;
    var v = grilleBrouillon();
    var signe = JSON.stringify(v);
    if(signe === brouillonEnvoye) return;
    brouillonEnvoye = signe;
    /* `send` ET NON `intent` : un brouillon n'attend aucune confirmation, et
       l'inscrire comme intention en attente ferait clignoter « le telephone
       principal n'a pas repondu » a chaque mot tape. */
    send('act', { a: 'form', f: brouillonId, v: v, d: 1, r: revSuivante() });
  }

  function arreterBrouillon(){
    if(brouillonTimer){ clearTimeout(brouillonTimer); brouillonTimer = null; }
    brouillonId = null;
    brouillonChamps = [];
    brouillonEnvoye = '';
  }

  /* LA ZONE DE TEXTE EPOUSE SON CONTENU. Sans ca elle garderait une hauteur
     fixe et couperait la phrase qu'on vient d'ecrire, ce qui etait tout le
     defaut de l'`<input>` qu'elle remplace. */
  function autoHaut(t){
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 180) + 'px';
  }

  /* ------------------------------------------------------------------
     LES GESTES QUE LE JEU PROPOSE : « TROUVÉ », « PASSER ».

     POURQUOI C'EST GENERIQUE. Cette page ne connait aucune regle, et c'est
     ce qui lui permet de servir tous les jeux sans grossir. Le maitre
     envoie donc le BOUTON ENTIER — son libelle, son allure, et le message a
     renvoyer tel quel s'il est presse. La page l'affiche et le transmet ;
     c'est le maitre qui verifie que le geste est recevable (le bon tour, le
     bon mot, le bon joueur), parce que lui seul le sait.

     LE BOUTON SE DESARME DES QU'IL EST PRESSE. Sous chrono on appuie deux
     fois, et le doigt rebondit : sans ça, un « trouve » pouvait bruler deux
     mots. Le maitre s'en garde aussi de son cote — le message porte le
     numero du mot — mais un bouton qui reste vif apres un appui donne
     surtout l'impression que rien ne s'est passe. */
  var ACTE_REARME = 4000;

  function posActes(hote, liste){
    if(!liste || !liste.length) return;
    var rang = el('div','actes');
    liste.forEach(function(a){
      if(!a || !a.msg) return;
      var b = el('button', a.ok ? 'acte ok' : 'acte', a.lbl || '?');
      if(a.off){
        b.disabled = true;
        b.className = 'acte off';
      } else {
        b.onclick = function(){
          if(b.disabled) return;
          b.disabled = true;
          b.className = 'acte off';
          intent('act', a.msg);
          /* ET IL SE REARME S'IL NE SE PASSE RIEN. Normalement le maitre
             repond en moins d'une seconde par une scene neuve, qui remplace
             ces boutons (voir `majActesForm`). Mais un paquet perdu en 4G,
             ou un geste que le maitre a refuse, laissait le bouton eteint
             pour tout le reste du tour : le joueur n'avait plus aucun moyen
             de valider un mot. Rejouer le meme message est sans danger — il
             porte le numero du mot, et le maitre ne le compte qu'une fois. */
          setTimeout(function(){
            if(!document.body.contains(b)) return;
            b.disabled = false;
            b.className = a.ok ? 'acte ok' : 'acte';
          }, ACTE_REARME);
        };
      }
      rang.appendChild(b);
    });
    hote.appendChild(rang);
  }

  function batirForm(f){
    /* LE MEME FORMULAIRE QUI REVIENT GARDE SON DESSIN.

       Quand le maitre sort du jeu, meme une minute, la scene tombe et le
       panneau se ferme ; quand il revient, le meme formulaire (meme
       identifiant de tour) est republie. Le dessin en cours etait perdu :
       le panneau se rebatissait sur une ardoise vide. Les traits sont encore
       en memoire a ce moment-la — on les reprend. (La saisie, elle, est
       gardee par `majForm`.) */
    var traitsRepris = (f.id === formBatiId && f.dessin) ? traits : [];
    formBatiId = f.id;
    /* ON LACHE L'ARDOISE PRECEDENTE. `innerHTML = ''` retire le canvas du
       document mais pas l'ecouteur de redimensionnement qu'on lui a attache
       sur `window` : sans ce retrait, chaque manche en ajoutait un, et au
       bout de dix manches un simple pivotement de telephone rejouait dix
       peintures sur des canvas morts. */
    if(croquis){
      window.removeEventListener('resize', peindreCroquis);
      /* ET L'ECOUTEUR DU RELACHEMENT DE SOURIS, pose sur `window` par
         `brancherDoigt`. Il n'etait pas retire : chaque manche en ajoutait
         un, et au bout de dix manches un simple clic rejouait dix fois la
         fin de trait — donc dix diffusions. */
      if(finDoigt){ window.removeEventListener('mouseup', finDoigt); }
      finDoigt = null;
      croquis = null;
      croquisFait = null;
      traits = [];
      traitEnCours = null;
    }
    corpsF.innerHTML = '';
    titreF.textContent = f.titre || 'Ta reponse';
    formBig = null;
    formActes = null;
    formActesSig = '';

    /* `sous` et `consigne` : voir `#form.dessin .card.consigne`. */
    if(f.sous) corpsF.appendChild(el('div','hint sous', f.sous));
    if(f.big){
      var g = el('div', f.dessin ? 'card consigne' : 'card');
      if(f.bigLbl) g.appendChild(el('div','lbl', f.bigLbl));
      formBig = el('div','big', f.big);
      g.appendChild(formBig);
      corpsF.appendChild(g);
    }

    /* CE QU'IL Y A A REGARDER : le dessin du maillon precedent. Il est en
       LECTURE SEULE et pose au-dessus de la reponse — on regarde, puis on
       ecrit. Le meme rendu que l'ardoise du salon, avec le meme cadre :
       c'est ce qui garantit qu'on voit exactement ce que l'autre a trace, et
       pas une version etiree. */
    /* UN FORMULAIRE A SAISIE QUI MONTRE UN DESSIN (telephone arabe) : le
       dessin prend la hauteur qui reste, et la garde clavier ouvert. Voir
       `#form.vue`. */
    var avecVue = !!(f.it && f.it.length && !f.dessin);
    panneauF.classList.toggle('vue', avecVue);
    /* UNE ARDOISE A REMPLIR : elle prend toute la hauteur qui reste. Voir
       `.ardoise-invite`. */
    panneauF.classList.toggle('dessin', !!f.dessin);
    panneauF.classList.remove('clavier');
    vueCourante = null;
    if(f.it && f.it.length){
      var vu = document.createElement('canvas');
      vu.className = 'croquis';
      var cadreVu = el('div', avecVue ? 'slate vue' : 'slate');
      /* Le fond du theme DE CET INVITE, comme son ardoise a dessiner (voir
         `fondArdoiseInvite`) — plus celui du maitre (`f.fond`). */
      var fondVu = fondArdoiseInvite();
      cadreVu.style.background = fondVu;
      cadreVu.appendChild(vu);
      corpsF.appendChild(cadreVu);
      vueCourante = { cv: vu, items: f.it, fond: fondVu };
      setTimeout(function(){ peindreVue(vu, f.it, fondVu); }, 0);
    }
    var chrono = el('div','chrono'); chrono.id = 'chronoF';
    corpsF.appendChild(chrono);
    majChronoForm(f);

    /* LE DESSIN : le formulaire porte une ardoise au lieu de champs. Les
       deux ne se melangent pas — on ecrit OU l'on dessine, jamais les deux :
       c'est la regle du jeu, et un ecran qui proposerait les deux ferait
       hesiter au moment ou le chrono tourne. */
    if(f.dessin){
      batirCroquis(f, corpsF);
      /* LE CHRONO PASSE SUR L'ARDOISE, en badge : voir `.ardoise-zone
         .chrono`. Meme element, meme identifiant — `majChronoForm` le
         trouve la ou il est. */
      var zoneC = corpsF.querySelector('.ardoise-zone');
      if(zoneC) zoneC.appendChild(chrono);
      if(traitsRepris.length){
        traits = traitsRepris;
        setTimeout(peindreCroquis, 0);
      }
    }

    /* LE DIRECT S'ARME ICI, une fois l'ardoise en place, et se desarme pour
       tous les autres formulaires : `liveId` est la seule chose qui autorise
       un envoi, donc le telephone arabe ne peut pas se mettre a diffuser par
       accident. */
    if(liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
    liveId = (f.dessin && f.live) ? f.id : null;
    wipeVu = f.wipe;

    var champs = f.dessin ? [] : (f.champs || []);

    /* LE BROUILLON S'ARME ICI. Voir `envoyerBrouillon` pour le pourquoi. */
    brouillonChamps = champs;
    brouillonId = (!f.dessin && f.brouillon && champs.length) ? f.id : null;
    brouillonEnvoye = '';

    /* « ENTREE » REND LA COPIE quand il n'y a qu'une case a remplir et pas
       de brouillon : c'est la touche que le clavier affiche en bas a droite,
       et c'est le geste qu'on fait naturellement apres une phrase. Avec
       plusieurs cases (le petit bac), elle referme seulement le clavier. */
    var boutonEnvoi = null;
    var entreeEnvoie = !brouillonId && champs.length === 1;

    champs.forEach(function(ch){
      var c = el('div','card');
      c.appendChild(el('div','lbl', ch.lbl || ch.k));
      /* UNE ZONE DE TEXTE, ET PAS UNE LIGNE : voir `textarea.champ`. Deux
         cents caracteres au lieu de quarante — une reponse coupee au
         quarantieme caractere se lisait comme une faute de celui qui
         l'avait ecrite. */
      var i = document.createElement('textarea');
      i.className = 'champ';
      i.rows = 1;
      i.maxLength = 200;
      i.value = formChamps[ch.k] || '';
      i.oninput = function(){
        formChamps[ch.k] = i.value;
        autoHaut(i);
        planifierBrouillon();
      };
      /* ENTREE VALIDE, ELLE NE VA PAS A LA LIGNE. Un retour a la ligne dans
         une reponse ne veut rien dire, et le clavier des telephones affiche
         « entree » la ou on attend « suivant ». */
      i.setAttribute('enterkeyhint', entreeEnvoie ? 'send' : 'done');
      i.onkeydown = function(ev){
        if(ev.key !== 'Enter' || ev.isComposing) return;
        ev.preventDefault();
        if(entreeEnvoie && boutonEnvoi){ boutonEnvoi.click(); return; }
        i.blur();
      };
      /* CLAVIER OUVERT, LES CONSIGNES SE REPLIENT : voir `#form.clavier`. */
      i.onfocus = function(){ panneauF.classList.add('clavier'); };
      i.onblur = function(){
        lastBlur = Date.now();
        panneauF.classList.remove('clavier');
        envoyerBrouillon();
      };
      c.appendChild(i);
      corpsF.appendChild(c);
      setTimeout(function(){ autoHaut(i); }, 0);
    });

    /* EN DIRECT, IL N'Y A RIEN A RENDRE.

       Le dessin est deja parti, trait par trait. Un bouton « envoyer » ne
       pourrait que tromper — et un bouton qui referme le panneau au milieu du
       chrono ferait perdre le tour a celui qui le presse par reflexe. C'est
       le maitre qui decide quand la manche s'arrete ; ce panneau se referme
       alors tout seul (`majForm`). */
    if(liveId){
      corpsF.appendChild(
        el('div','hint', f.btn || 'La table te regarde dessiner.'));
      /* « TROUVÉ » ET « PASSER » SONT ICI, ET PAS SEULEMENT SUR L'ECRAN
         D'ACCUEIL : pendant tout le tour, celui qui dessine est dans ce
         panneau. Les chercher ailleurs coutait un aller-retour a chaque
         mot, sous chrono. */
      formActes = el('div');
      corpsF.appendChild(formActes);
      posActes(formActes, f.actes);
      formActesSig = JSON.stringify(f.actes || []);
      return;
    }

    /* ON LE DIT, PARCE QUE CE N'EST PAS DEVINABLE. Le bouton ressemble a
       « sans moi, rien ne part » — c'etait vrai, ça ne l'est plus, et
       quelqu'un qui le croit encore ecrit le pouce en l'air au lieu
       d'ecrire. */
    if(brouillonId){
      corpsF.appendChild(el('div','hint',
        'Ce que tu écris est transmis au fur et à mesure, et ta copie est '
        + 'ramassée toute seule à la fin du temps. Le bouton sert à dire '
        + 'que tu as fini avant les autres.'));
    }

    var b = el('button','primary', f.btn || 'Envoyer');
    boutonEnvoi = b;
    b.onclick = function(){
      var msg = { a: 'form', f: f.id };
      if(f.dessin){
        /* UN DESSIN VIDE N'EST PAS UNE REPONSE. On le laisse partir quand
           meme — le chrono peut finir avant l'idee — mais le jeu doit pouvoir
           le distinguer d'une absence de reponse, d'ou la liste vide plutot
           que rien du tout. */
        msg.it = traits;
      } else {
        var v = {};
        champs.forEach(function(ch){
          v[ch.k] = (formChamps[ch.k] || '').trim();
        });
        msg.v = v;
        /* NUMEROTEE comme les brouillons : une copie MODIFIEE doit l'emporter
           sur la premiere, meme si celle-ci, renvoyee par la boite d'envoi,
           arrive apres. Voir `revSuivante`. */
        msg.r = revSuivante();
      }
      /* LE BROUILLON S'ARRETE AVANT L'ENVOI DEFINITIF, et pas apres : un
         brouillon parti ensuite arriverait derriere la copie rendue et
         reposerait la grille telle qu'elle etait juste avant. Le maitre
         s'en garde aussi de son cote, mais il vaut mieux ne pas l'envoyer. */
      arreterBrouillon();

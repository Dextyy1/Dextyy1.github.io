      formEnvoye = f.id;
      /* ON GARDE LA COPIE : tant que le maitre ne l'a pas enregistree, elle
         repart (voir `relancerCopie`). */
      formMsg = msg;
      formEnvoyeAt = Date.now();
      panneauF.classList.remove('clavier');
      intent('act', msg);
      fermerForm();
      render(1);
    };
    /* UNE GRILLE A REMPLIR GARDE SON BOUTON A L'ECRAN : voir `#form .piedF`.
       Pas en mode `vue` (le dessin a interpreter) : le panneau n'y defile
       pas, la saisie colle deja au clavier. Pas sur l'ardoise non plus, qui
       a sa propre mise en page. */
    if(!f.dessin && !avecVue && champs.length){
      var pied = el('div','piedF');
      pied.appendChild(b);
      corpsF.appendChild(pied);
    } else {
      corpsF.appendChild(b);
    }
  }

  /* « MODIFIER MA COPIE » : la grille rendue se rouvre, avec ses reponses.

     Tant que la manche court, rendre n'est pas definitif — sur papier non
     plus, on peut raturer tant que personne n'a crie « stop ». On oublie
     donc qu'on a repondu, et le panneau se rebatit sur la meme grille :
     `formChamps` a garde la saisie (meme formulaire, voir `majForm`). Le
     maitre garde la DERNIERE version recue, grace a son numero (`r`).

     Le brouillon repart armé, mais sur la grille telle qu'elle a ete rendue :
     rouvrir pour relire, sans rien toucher, n'envoie rien — et ne fait donc
     pas croire au maitre qu'on s'est remis a ecrire. */
  function modifierCopie(){
    var f = formActuel();
    if(!f || !f.id || !f.modif || f.id !== formEnvoye) return;
    formEnvoye = null;
    formMsg = null;
    formVu = null;
    majForm();
    if(brouillonId) brouillonEnvoye = JSON.stringify(grilleBrouillon());
    ouvrirForm();
    render(1);
  }

  /* ------------------------------------------------------------------
     LA COPIE RENDUE N'EST « RENDUE » QUE QUAND LE MAITRE L'A ENREGISTREE.

     C'est la panne d'une vraie partie de telephone arabe : un invite rend
     son dessin, sa page affiche « ta reponse est partie, on attend les
     autres » — mais la copie n'a jamais ete enregistree, et le maitre
     attend ce joueur pour toujours. La page se croyait quitte au moment du
     clic, avant toute livraison.

     La boite d'envoi (`poster`) garantit que le message ARRIVE au salon.
     Elle ne peut pas garantir que le JEU l'a pris : le maitre etait peut-etre
     sorti de l'ecran du jeu (personne n'ecoutait), ou la copie visait un
     tour qu'il venait de quitter. Un formulaire qui porte `ack` promet donc
     davantage : le maitre le RETIRE des qu'il a enregistre la copie. Tant
     qu'il nous est encore propose, rien n'est enregistre — et, une fois la
     boite d'envoi vide, on renvoie, et on redemande la scene (celle qui nous
     l'aurait retire a pu se perdre).
     ------------------------------------------------------------------ */
  var formMsg = null;
  var formEnvoyeAt = 0;
  var RENVOI_COPIE_MS = 4000;

  function copieEnAttente(f){
    return !!(f && f.ack && f.id === formEnvoye && formMsg);
  }

  function relancerCopie(){
    if(!joined) return;
    var f = formActuel();
    if(!copieEnAttente(f)) return;
    /* ENCORE DANS LA BOITE D'ENVOI : elle s'en occupe. On ne compte le delai
       qu'a partir du moment ou le salon l'a recue. */
    if(typeof copieEnVol === 'function' && copieEnVol(f.id)){
      formEnvoyeAt = Date.now();
      return;
    }
    if(Date.now() - formEnvoyeAt < RENVOI_COPIE_MS) return;
    formEnvoyeAt = Date.now();
    send('act', formMsg);
    askResync();
  }
  setInterval(relancerCopie, 1000);

  function ouvrirForm(){
    if(!panneauF.hidden) return;
    try{ history.pushState({ pivvy: 'form' }, ''); }catch(e){}
    panneauF.hidden = false;
    /* LA PAGE DERRIERE NE DEFILE PLUS pendant qu'un panneau plein ecran est
       ouvert : le clavier la faisait glisser sous lui, et c'est elle qu'on
       voyait par en dessous. */
    document.documentElement.classList.add('formOuvert');
    setTimeout(repeindreVue, 0);
  }

  function fermerForm(viaRetour){
    var etait = !panneauF.hidden;
    panneauF.hidden = true;
    document.documentElement.classList.remove('formOuvert');
    panneauF.classList.remove('clavier');
    if(etait && !viaRetour){
      try{ history.back(); }catch(e){}
    }
  }

  /* ------------------------------------------------------------------
     LA MESSAGERIE

     Elle sert moins qu'on ne croit a se parler — on est dans la meme piece —
     et beaucoup a ce que la piece ne permet pas : dire quelque chose sans le
     dire a voix haute pendant qu'un autre mime.

     ELLE N'A AUCUN ETAT PROPRE. Le maitre rediffuse les quarante dernieres
     lignes avec l'etat, toutes les deux secondes : celui qui rate un message
     a le suivant, un rechargement ne perd rien, et il n'y a ni accuse de
     reception ni numero d'ordre a tenir. On ne fait ici qu'AJOUTER ce qui
     n'y est pas encore, jamais tout redessiner — c'est ce qui garde le champ
     de saisie et le clavier en vie.
     ------------------------------------------------------------------ */
  var bulle = document.getElementById('bulle');
  var pastille = document.getElementById('pastille');
  var panneau = document.getElementById('tchat');
  var lignes = document.getElementById('lignes');
  var champ = document.getElementById('motxt');
  var vus = 0;              // le plus grand identifiant deja affiche
  var lus = 0;              // ...et deja VU par l'utilisateur
  var ouvertTchat = false;
  /* LA SECONDE PORTE DE LA MESSAGERIE, dans l'en-tete de l'ecran de jeu
     (`#form`), qui couvre la bulle flottante. Meme fenetre, meme garde
     (`ouvertTchat`), meme pastille : les deux se tiennent ensemble par
     `pastilles`. */
  var bulleF = document.getElementById('bulleF');
  var pastilleF = document.getElementById('pastilleF');
  function pastilles(nonLus){
    pastille.hidden = !nonLus;
    pastilleF.hidden = !nonLus;
  }

  function majTchat(){
    var liste = (state && state.chat) ? state.chat : [];
    /* LA BULLE N'APPARAIT QUE S'IL Y A QUELQU'UN A QUI PARLER. Seul dans le
       salon, elle n'est qu'un bouton qui encombre un coin de l'ecran. */
    var utile = !!state && !!(myClaim || (state.claims && state.claims[dev]));
    bulle.hidden = !utile;
    bulleF.hidden = !utile;
    if(!utile){
      panneau.hidden = true;
      ouvertTchat = false;
      cacherApercu();
      return;
    }

    var neuf = false;
    liste.forEach(function(l){
      if(!l || l.i <= vus) return;
      vus = l.i;
      neuf = true;
      var m = el('div','msg');
      var b = document.createElement('b');
      b.textContent = l.w || '';
      m.appendChild(b);
      m.appendChild(document.createTextNode(l.t || ''));
      lignes.appendChild(m);
    });
    if(neuf && ouvertTchat){
      lus = vus;
      /* On ne descend que si l'utilisateur etait DEJA en bas : le tirer vers
         le bas alors qu'il relit un message plus haut est le genre de detail
         qui rend une messagerie desagreable. */
      lignes.scrollTop = lignes.scrollHeight;
    }
    /* LE DERNIER MESSAGE SE MONTRE TOUT SEUL, si la fenetre est fermee.
       Ouverte, il est deja lisible en grand juste derriere. */
    if(neuf && !ouvertTchat && liste.length && !estDeMoi(liste[liste.length - 1])){
      montrerApercu(liste[liste.length - 1]);
    }
    majAnnonce();
    pastilles(vus > lus);
    if(!liste.length && !lignes.querySelector('.vide')){
      lignes.appendChild(el('div','vide',
        'Rien pour l’instant. Ecris quelque chose.'));
    } else if(liste.length){
      var vide = lignes.querySelector('.vide');
      if(vide) vide.remove();
    }
  }

  /* ------------------------------------------------------------------
     L'APERÇU FLOTTANT. Voir `#apercu`. */
  var apercu = document.getElementById('apercu');
  var apercuFin = null;
  var APERCU_DUREE = 5000;

  /* CE QUI PASSE DANS LE BANDEAU : un message de quelqu'un, ou une ANNONCE
     du jeu (« Léa a joué le Bouclier »). Les deux se voient passer et
     s'oublient ; seuls les messages se relisent, et eux seuls entrent dans
     la conversation. Voir `PartyController.announce` cote Dart. */
  var annonceVue = 0;

  function majAnnonce(){
    var a = state && state.an;
    if(!a || typeof a.i !== 'number' || a.i <= annonceVue) return;
    annonceVue = a.i;
    montrerApercu({ t: a.t });
  }

  function montrerApercu(l){
    if(!l) return;
    var b = apercu.querySelector('b');
    b.textContent = l.w || '';
    b.hidden = !l.w;
    apercu.querySelector('span').textContent = l.t || '';
    apercu.hidden = false;
    /* DEUX IMAGES DE DECALAGE AVANT LA CLASSE : posee dans la meme image que
       le `hidden = false`, la transition ne part pas — le navigateur n'a
       jamais vu l'etat de depart. */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ apercu.className = 'vu'; });
    });
    if(apercuFin) clearTimeout(apercuFin);
    apercuFin = setTimeout(cacherApercu, APERCU_DUREE);
  }

  function cacherApercu(){
    if(apercuFin){ clearTimeout(apercuFin); apercuFin = null; }
    apercu.className = '';
    setTimeout(function(){ if(apercu.className !== 'vu') apercu.hidden = true; }, 240);
  }

  /* SON PROPRE MESSAGE NE S'ANNONCE PAS. L'echo de ce qu'on vient d'ecrire
     revient avec l'etat, jusqu'a deux secondes plus tard sur le relais : si
     la fenetre a ete refermee entre-temps, le bandeau montrait a l'invite sa
     propre phrase, comme si quelqu'un d'autre venait de lui ecrire. Le nom
     est celui que le MAITRE attache a notre appareil, donc c'est lui qu'on
     compare. */
  function estDeMoi(l){
    var id = myClaim || (state && state.claims && state.claims[dev]);
    var ps = (state && state.players) || [];
    for(var k = 0; k < ps.length; k++){
      if(ps[k] && ps[k].id === id) return !!l && l.w === ps[k].name;
    }
    return false;
  }

  function ouvrirTchat(){
    /* UNE SEULE FENETRE. Deux appuis rapides sur la bulle posaient deux
       entrees d'historique pour un seul panneau : le retour du telephone
       devait ensuite etre presse deux fois, et le premier semblait ne rien
       faire. */
    if(ouvertTchat) return;
    /* On ouvre : l'aperçu n'a plus de raison d'etre, la conversation entiere
       arrive par-dessus. */
    cacherApercu();
    ouvertTchat = true;
    panneau.hidden = false;
    lus = vus; pastilles(false);
    lignes.scrollTop = lignes.scrollHeight;
    /* LE BOUTON RETOUR DU TELEPHONE DOIT FERMER LA FENETRE, pas quitter la
       page. Une entree d'historique posee ici, retiree en refermant : c'est
       la seule façon d'attraper un geste que le navigateur ne nous confie
       pas autrement. */
    try { history.pushState({ tchat: 1 }, ''); } catch(e){}
  }

  function fermerTchat(parHistorique){
    if(!ouvertTchat) return;
    ouvertTchat = false;
    panneau.hidden = true;
    lus = vus; pastilles(false);
    if(!parHistorique){
      /* LE RETOUR QU'ON PROVOQUE SOI-MEME NE DOIT RIEN FERMER D'AUTRE. La
         messagerie peut desormais s'ouvrir PAR-DESSUS l'ecran de jeu : le
         `popstate` de ce `history.back()` refermait alors aussi la grille
         dessous, en plein chrono. */
      retourTchat = Date.now();
      try { history.back(); } catch(e){ retourTchat = 0; }
    }
  }
  var retourTchat = 0;

  bulle.onclick = ouvrirTchat;
  bulleF.onclick = ouvrirTchat;
  document.getElementById('retour').onclick = function(){ fermerTchat(false); };
  window.addEventListener('popstate', function(){
    /* UNE SEULE ENTREE D'HISTORIQUE A LA FOIS : les trois fenetres en posent
       une en s'ouvrant, et le bouton retour du telephone doit refermer celle
       qui est ouverte — pas quitter la page. */
    /* SAUF LA MESSAGERIE, qui peut se poser sur l'ecran de jeu : c'est alors
       deux entrees, et un retour ne doit fermer QUE celle du dessus. Un
       retour du telephone ferme la messagerie si elle est ouverte, et rien
       d'autre ; celui que `fermerTchat` provoque ne ferme rien. La fenetre
       d'une seconde borne le cas ou `history.back()` n'a rien a depiler (et
       ne declenche donc aucun `popstate`) : le retour suivant, un vrai, ne
       doit pas etre avale. */
    if(retourTchat && Date.now() - retourTchat < 1000){
      retourTchat = 0;
      return;
    }
    retourTchat = 0;
    if(ouvertTchat){
      fermerTchat(true);
      return;
    }
    fermerJeu(true);
    fermerParam(true);
    fermerForm(true);
  });

  function envoyer(){
    var texte2 = champ.value.trim();
    if(!texte2) return;
    champ.value = '';
    /* PAS D'AFFICHAGE OPTIMISTE. On n'ajoute pas la ligne soi-meme : elle
       revient avec l'etat, avec le nom que le MAITRE nous attribue. L'ecrire
       d'avance donnerait un message affiche deux fois quand tout va bien, et
       un message affiche qui n'existe pour personne quand le mot de passe est
       faux. */
    intent('chat', { text: texte2 });
    champ.focus();
  }
  document.getElementById('envoi').onclick = envoyer;
  champ.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); envoyer(); }
  });

  /* ------------------------------------------------------------------
     LES EFFETS : FAIRE VOIR, SANS FAIRE ENTENDRE

     LA VIBRATION A ETE ESSAYEE PUIS RETIREE, et la raison merite d'etre
     ecrite : un telephone qui vibre s'ENTEND. Meme en faisant vibrer tout le
     monde en meme temps pour ne trahir personne, le resultat etait pire que
     le probleme — huit telephones qui bourdonnent au milieu d'une nuit ou
     l'on chuchote, et la moitie de la table qui se demande si c'est a elle
     de se reveiller. Un jeu ou l'on ferme les yeux se joue en SILENCE.

     Il ne reste donc que **l'ecran**, et c'est tres bien ainsi : un aplat de
     couleur par-dessus la page, aucune permission, aucune limite, iPhone
     compris. Dans une piece sombre, un telephone qui vire au blanc puis au
     rouge se voit de l'autre bout de la table.

     LA LAMPE TORCHE A ETE ECRITE PUIS RETIREE, elle aussi. Il n'existe aucune
     API « lampe » sur le web : il faut ouvrir un flux de la CAMERA et allumer
     son flash — donc demander l'autorisation d'acceder a la camera, avec le
     mot ecrit dedans, et laisser le voyant de confidentialite allume toute la
     partie. Pour huit invites, dans une soiree, c'est un mauvais echange. Et
     ça ne marchait ni sur iPhone (Safari ignore la contrainte `torch`) ni en
     Wi-Fi local (`getUserMedia` est interdit sur une origine `http://`).
     Beaucoup de conditions pour un peu de lumiere de plus.

     ------------------------------------------------------------------ */
  var fxVus = 0;
  var flashDiv = null;

  /* UN APLAT PLEIN ECRAN, pose une fois et reutilise. Le recreer a chaque
     fois obligerait le navigateur a recalculer la page au moment precis ou
     l'on veut qu'il dessine vite. */
  function flasher(couleur, fois){
    if(!flashDiv){
      flashDiv = document.createElement('div');
      flashDiv.id = 'flash';
      document.body.appendChild(flashDiv);
    }
    var n = fois || 3;
    var d = flashDiv;
    var i = 0;
    /* ON COMMENCE PAR DU BLANC. C'est ce qui se voit de loin : un ecran de
       telephone n'a pas de reglage de luminosite accessible depuis une page,
       et le blanc plein est le plus lumineux qu'on puisse afficher. Le rouge
       vient ensuite, pour dire de quoi il s'agit. */
    (function battre(){
      if(i >= n * 2){ d.style.opacity = '0'; return; }
      if(i % 2 === 0){
        d.style.background = (i === 0) ? '#FFFFFF' : couleur;
        d.style.opacity = '1';
      } else {
        d.style.opacity = '0';
      }
      i++;
      setTimeout(battre, i % 2 === 0 ? 190 : 150);
    })();
  }

  /* Joue un effet, s'il est nouveau.

     LE NUMERO D'ORDRE EST LE COEUR DE CETTE FONCTION. L'etat et la scene sont
     rediffuses toutes les deux secondes : sans lui, un telephone clignoterait
     sans discontinuer pendant toute la nuit. */
  function jouerEffet(fx){
    if(!fx || typeof fx.n !== 'number' || fx.n <= fxVus) return;
    fxVus = fx.n;
    if(fx.k === 'mort'){
      flasher('#B3261E', 3);
    }
  }

  /* ------------------------------------------------------------------
     LA MAIN : LES CARTES DU MODE SOIREE

     LE POINT DE TOUT L'EXERCICE : jouer une carte sans que la table le voie
     venir. Un Bouclier sorti sur le telephone principal, c'est se lever,
     traverser la piece et annoncer son coup avant de le jouer — autant ne
     pas l'avoir. Ici, ça se fait dans la poche.

     CE QUI N'EST PAS PRIVE, EN REVANCHE, C'EST L'EFFET. Une carte qui annule
     une gorgee change le tableau : le maitre l'annonce a tout le monde des
     qu'elle est jouee. Le choix est cache, le resultat non — sinon ce
     ne serait plus une carte, ce serait une triche.

     ON NE JOUE PAS SOI-MEME, ON DEMANDE. La page envoie une intention ; le
     maitre verifie que la carte est bien dans NOTRE main — il resout le
     joueur d'apres l'appareil, pas d'apres le message — puis l'applique. Un
     invite qui reclamerait le Bouclier de son voisin n'obtient rien.
     ------------------------------------------------------------------ */
  var bJeu = document.getElementById('cartes');
  var pastilleC = document.getElementById('pastilleC');
  var panneauC = document.getElementById('jeu');
  var mainC = document.getElementById('mainC');
  var ouvertJeu = false;

  /* CE QUE LA FENETRE MONTRE : la liste, le choix d'une cible, ou le champ du
     Joker. Sans cette distinction, l'etat recu toutes les deux secondes
     remettait la LISTE a la place du sous-ecran — le texte tape s'effaçait,
     et surtout le doigt qui visait « Lea » dans le choix de la cible tombait
     sur un bouton de carte apparu entretemps. Une carte partait toute seule.
     C'est la meme faute que le clavier qui se referme, sous un autre
     deguisement : reconstruire ce que quelqu'un est en train de toucher. */
  var modeC = 'liste';

  /* La main telle qu'elle est DESSINEE. On ne redessine que si elle a
     vraiment change : le maitre rediffuse la meme toutes les deux secondes. */
  var signeC = '';

  /* Notre poche, descellee. Meme mecanique que la part privee de la scene :
     le maitre la brouille avec le secret de cet appareil, et le canal la
     diffuse a tous — qui n'en font rien. */
  /* ------------------------------------------------------------------
     LE SOUVENIR : le mot ou la mission qu'on garde toute la soiree.

     CE QUE LA SCENE NE POUVAIT PAS FAIRE. Le mot interdit et la mission
     secrete courent pendant que d'autres jeux passent — et la scene, elle,
     appartient au jeu AFFICHE : des que la soiree enchainait, le mot
     disparaissait de l'ecran de celui qui devait le garder. Il fallait le
     redemander a voix haute, c'est-a-dire le bruler.

     Il voyage donc a cote de la scene, brouille par appareil comme la poche
     (voir `PartyController.setKeepsake`), et il est pose sur CHAQUE ecran,
     quel que soit le jeu en cours. Cache par defaut : le telephone se penche
     vite du cote du voisin.
     ------------------------------------------------------------------ */
  var devoileS = false;

  function souvenir(){
    if(!state || !state.keep) return null;
    var sceau = state.keep[dev];
    if(!sceau) return null;
    var brut = ouvrir(secret, sceau);
    if(!brut) return null;
    try { return JSON.parse(brut); } catch(e){ return null; }
  }

  function poserSouvenir(hote){
    var k = souvenir();
    if(!k || !k.text) return;
    var c = el('div','card secret');
    c.appendChild(el('div','lbl', k.label || 'Rien qu’a toi'));
    if(devoileS){
      c.appendChild(el('div','big', k.text));
      if(k.note) c.appendChild(el('div','hint', k.note));
      var cacher = el('button', null, 'Cacher');
      cacher.onclick = function(){ devoileS = false; render(1); };
      c.appendChild(cacher);
    } else {
      var voir = el('button', null, '• • •  ' + (k.label || 'Ton secret')
        + ' — appuie pour revoir');
      voir.onclick = function(){ devoileS = true; render(1); };
      c.appendChild(voir);
    }
    hote.appendChild(c);
  }

  function poche(){
    if(!state || !state.pocket) return null;
    var sceau = state.pocket[dev];
    if(!sceau) return null;
    var brut = ouvrir(secret, sceau);
    if(!brut) return null;
    try { return JSON.parse(brut); } catch(e){ return null; }
  }

  function majJeu(){
    var p = poche();
    var cartes = (p && p.cards) ? p.cards : [];
    bJeu.hidden = !p || !cartes.length;
    if(bJeu.hidden){
      /* PAR `fermerJeu` ET PAS A LA MAIN. Refermer le panneau sans defaire
         l'entree d'historique posee en l'ouvrant laissait une pression du
         bouton retour sans effet visible : le joueur appuyait une seconde
         fois et quittait la page. Le cas arrive des qu'on joue sa derniere
         carte. */
      fermerJeu(false);
      signeC = '';
      return;
    }
    pastilleC.hidden = false;
    pastilleC.textContent = String(cartes.length);
    if(!ouvertJeu || modeC !== 'liste') return;
    var signe = JSON.stringify(p);
    if(signe === signeC) return;
    signeC = signe;
    dessineMain(p);
  }

  function dessineMain(p){
    modeC = 'liste';
    signeC = JSON.stringify(p);
    mainC.innerHTML = '';
    if(p.last){
      mainC.appendChild(el('div','banner',
        'Tu peux repondre a : ' + p.last));
    }
    if(p.armed){
      mainC.appendChild(el('div','banner',
        'Attention : ta prochaine sanction compte double.'));
    }
    (p.cards || []).forEach(function(c){
      var b = el('button','carte');
      b.appendChild(el('span','em', c.e || '🃏'));
      var g = el('div');
      g.appendChild(el('div','nom', c.n || ''));
      g.appendChild(el('div','eff', c.x || ''));
      b.appendChild(g);
      b.onclick = function(){ jouer(c, p); };
      mainC.appendChild(b);
    });
    mainC.appendChild(el('div','hint',
      'Le maitre applique la carte et l’annonce a la table. '
      + 'Ton choix, lui, ne se voit pas.'));
  }

  /* Jouer une carte : au plus deux questions, et seulement celles que la
     carte impose. Une confirmation de plus serait une confirmation de trop —
     on sort un Bouclier dans les trois secondes ou on ne le sort pas. */
  function jouer(c, p){
    if(c.t){
      demander(p.peers || [], function(cible){
        if(cible) envoiCarte(c, cible, null);
      });
      return;
    }
    if(c.id === 'joker'){
      /* PAS DE `prompt` : il bloque la page entiere, ce qui gele le flux
         d'etat et le chrono derriere. Un champ ordinaire fait la meme chose
         sans arreter la soiree. */
      saisirNote(function(note){
        if(note !== null) envoiCarte(c, null, note);
      });
      return;
    }
    envoiCarte(c, null, null);
  }

  function envoiCarte(c, cible, note){
    intent('act', {
      a: 'card', id: c.id,
      target: cible || '',
      note: note || ''
    });
    fermerJeu(false);
  }

  function saisirNote(suite){
    modeC = 'note';
    mainC.innerHTML = '';
    mainC.appendChild(el('div','lbl','Ton effet, en une phrase'));
    var i = el('input'); i.type = 'text'; i.maxLength = 120;
    i.placeholder = 'Ce que la table devra faire';
    mainC.appendChild(i);
    var ok = el('button','primary','Jouer le Joker');
    ok.onclick = function(){ suite(i.value.trim()); };
    mainC.appendChild(ok);
    var non = el('button', null, 'Annuler');
    non.onclick = function(){ suite(null); dessineMain(poche() || {}); };
    mainC.appendChild(non);
    setTimeout(function(){ i.focus(); }, 0);
  }

  /* Le choix de la cible, en pleine page plutot qu'en `prompt` : taper un
     prenom a la main sur un telephone, sous chrono, c'est une faute de frappe
     et une carte perdue. */
  function demander(noms, suite){
    modeC = 'cible';
    mainC.innerHTML = '';
    mainC.appendChild(el('div','lbl','Sur qui ?'));
    noms.forEach(function(n){
      var b = el('button', null, n);
      b.onclick = function(){ suite(n); };
      mainC.appendChild(b);
    });
    var annule = el('button', null, 'Annuler');
    annule.onclick = function(){ dessineMain(poche() || {}); };
    mainC.appendChild(annule);
  }

  function ouvrirJeu(){
    var p = poche();
    if(!p) return;
    ouvertJeu = true;
    panneauC.hidden = false;
    dessineMain(p);
    try { history.pushState({ jeu: 1 }, ''); } catch(e){}
  }

  function fermerJeu(parHistorique){
    if(!ouvertJeu) return;
    ouvertJeu = false;
    panneauC.hidden = true;
    if(!parHistorique){ try { history.back(); } catch(e){} }
  }

  bJeu.onclick = ouvrirJeu;
  document.getElementById('retourC').onclick = function(){ fermerJeu(false); };

  /* Expose de quoi faire tourner la page hors ligne dans un test :
     voir `tools/relay_page_check.js`. Aucune incidence en production. */
  window.__pivvy = {
    encode: encode, decode: decode, unwrap: unwrap,
    onMessage: onMessage, render: render,
    device: function(){ return dev; },
    tchat: function(){ return { ouvert: ouvertTchat, vus: vus, lus: lus }; },
    poche: poche,

    sceller: sceller, ouvrir: ouvrir, idDepuis: idDepuis,
    secret: function(){ return secret; },
    /* La scene telle que la page la tient : le banc d'essai verifie que les
       queues recollent, et qu'un trou provoque bien une resynchronisation. */
    scene: function(){ return { head: scene, items: sceneItems, ep: sceneEpoch }; },
    peindre: function(){ paintScene(); },
    HEARTBEAT_MS: HEARTBEAT_MS,
    PENDING_MS: PENDING_MS,
    /* La boite d'envoi, pour verifier qu'un geste repart tant qu'il n'est pas
       accuse, et plus apres. */
    sortants: function(){ return sortants.map(function(o){ return o.id; }); },
    copieEnVol: copieEnVol,
    geste: function(d){ send('act', d); },
    /* Efface ce que la page a retenu de cet appareil. Sert aux essais, qui
       doivent pouvoir repartir d'un invite qui n'a jamais rien choisi. */
    oublier: function(){ S.removeItem(claimKey); S.removeItem(passKey); }
  };

  /* ON BAT AUSSI AU REVEIL, et c'est la moitie de la correction.
     Un minuteur gele ne rattrape pas son retard : au retour d'un ecran
     eteint, la page attendrait jusqu'a huit secondes avant de se manifester,
     alors que c'est precisement l'instant ou le maitre l'a oubliee. Ces
     trois evenements couvrent les trois façons de revenir : rallumer
     l'ecran, revenir sur l'onglet, retrouver du reseau. */
  /* ON EMPECHE L'ECRAN DE S'ETEINDRE.
     Deux raisons, et la seconde compte plus que la premiere : un ecran eteint
     ne clignote pas, et un navigateur dont l'ecran s'eteint GELE SES
     MINUTEURS — c'est la cause du decrochage qu'on a corrige il y a deux
     tours. Le verrou se perd des qu'on change d'onglet, d'ou la reprise dans
     `wake`. Non supporte partout ; l'absence n'est pas une panne. */
  var verrou = null;
  /* ------------------------------------------------------------------
     LA HAUTEUR VRAIMENT VISIBLE.

     Quand le clavier s'ouvre, la fenetre de MISE EN PAGE ne bouge pas : un
     panneau en `position:fixed; inset:0` garde donc toute la hauteur de
     l'ecran, et son bas — le bouton d'envoi — se retrouve CACHE SOUS LE
     CLAVIER, sans moyen d'y acceder. C'est le defaut qui rendait le
     telephone arabe injouable : on ecrivait sa phrase et on ne pouvait plus
     la rendre.

     `visualViewport` donne la hauteur reellement visible. On la pose en
     variable CSS, et les panneaux s'y bornent.
     ------------------------------------------------------------------ */
  function suivreClavier(){
    var vv = window.visualViewport;
    if(!vv) return;
    function maj(){
      var r = document.documentElement.style;
      r.setProperty('--vv', Math.round(vv.height) + 'px');
      /* LE DECALAGE DE LA ZONE VISIBLE, pas seulement sa hauteur : voir
         `--vvt` dans la feuille de style. Jamais negatif — le rebond d'iOS
         en donne un instant, et un panneau remonte d'autant laisserait
         passer le dessous. */
      r.setProperty('--vvt', Math.max(0, Math.round(vv.offsetTop)) + 'px');
    }
    vv.addEventListener('resize', maj);
    vv.addEventListener('scroll', maj);
    maj();
  }
  suivreClavier();

  function tenirEcran(){
    if(!('wakeLock' in navigator)) return;
    try {
      navigator.wakeLock.request('screen').then(function(v){
        verrou = v;
        v.addEventListener('release', function(){ verrou = null; });
      }).catch(function(){});
    } catch(e){}
  }

  function wake(){
    if(!verrou) tenirEcran();
    if(!joined) return;
    send('hello', {});
    reclaim();
    askResync();
    /* APRES la re-revendication : un geste arrive avant elle, chez un maitre
       qui nous a oublies, n'aurait pas de joueur — il ne serait pas accuse
       et repartirait, mais autant lui eviter le detour. */
    relancer(true);
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') wake();
  });
  window.addEventListener('focus', wake);
  window.addEventListener('online', wake);

  render(1);
  connect();
  tenirEcran();
})();
</script></body></html>

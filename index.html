<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pivvy</title>
<!--
  LA PAGE DES INVITES — VERSION RELAIS (4G).

  Son jumeau Wi-Fi vit dans `lib/core/party_server.dart` : meme allure, meme
  ecrans, meme protocole. Ce qui change est le TUYAU, et lui seul. En Wi-Fi
  le telephone maitre sert lui-meme cette page et repond en HTTP ; ici il n'y
  a plus de serveur a interroger, on parle au canal de diffusion Supabase.

  A GARDER EN TETE EN LA MODIFIANT : le telephone maitre est l'autorite. Cette
  page n'envoie que des INTENTIONS (« je suis Lea », « ajoute-moi ») et
  n'affiche que l'ETAT qu'on lui rediffuse. Elle ne decide de rien, ne garde
  rien, et un rechargement ne perd donc rien.

  L'enveloppe des messages doit rester identique a celle de `PartyMessage`
  (`lib/core/transport.dart`), au caractere pres. `tools/relay_page_check.js`
  le verifie — sans quoi les deux cotes se parleraient dans le vide, en
  silence et sans la moindre erreur.
-->
<style>
  :root{--bg1:#0A1436;--bg2:#16409B;--bg3:#050B22;--accent:#6C9BFF;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* LE BLANC SOUS LA PAGE, ET POURQUOI IL N'Y EN A PLUS.

     Le degrade vivait sur `body`, en `background-attachment:fixed`, et
     `html` n'avait aucun fond. Sur telephone, `fixed` n'est pas tenu (iOS
     l'ignore, Chrome Android le peint contre une fenetre qui change de
     taille quand le clavier monte ou que la barre d'adresse se replie), et
     tout ce que le degrade ne couvrait pas — sous le contenu quand le
     clavier pousse la page, dans le rebond d'un defilement — montrait le
     fond par defaut du navigateur : du blanc.

     Trois gestes, chacun pour une cause :
     - `html` porte une couleur PLEINE, la plus sombre du theme : c'est elle
       qui remplit le canevas partout ou rien d'autre ne peint ;
     - le degrade passe sur un calque fixe (`body::before`) haut de `100lvh`,
       la PLUS GRANDE hauteur que la fenetre puisse prendre : il couvre
       l'ecran barre d'adresse repliee comme depliee, et ne bouge plus ;
     - `overscroll-behavior:none` coupe le rebond et le « tirer pour
       recharger » qui decouvraient le dessous de la page — et qui, en
       pleine manche, rechargeaient la page d'un geste de trop. */
  html{background:var(--bg3);min-height:100%;overscroll-behavior:none}
  body{margin:0;min-height:100vh;min-height:100dvh;
       font:16px/1.45 -apple-system,BlinkMacSystemFont,
       "Segoe UI",Roboto,sans-serif;color:#fff;
       background:none;overscroll-behavior:none;padding:22px 18px 40px}
  /* `z-index:-1` sans contexte d'empilement sur `body` : le calque se pose
     juste au-dessus du fond de `html` et sous tout le reste. `body` ne doit
     donc JAMAIS reprendre de fond : il se peindrait par-dessus le degrade. */
  body::before{content:"";position:fixed;left:0;right:0;top:0;
       height:100vh;height:100lvh;z-index:-1;pointer-events:none;
       background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
  h1{font-size:26px;margin:6px 0 2px;font-weight:800;letter-spacing:.5px}
  .sub{opacity:.6;font-size:13px;margin-bottom:22px}
  .card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
        border-radius:18px;padding:16px;margin-bottom:12px}
  /* L'INTITULE PEUT ETRE UNE PHRASE. « Une phrase qui tue l'ambiance au
     lit » est une categorie du petit bac comme une autre : l'intitule doit
     donc se replier sur plusieurs lignes au lieu de deborder de sa carte.
     `overflow-wrap` traite en plus le mot unique trop long pour la largeur
     du telephone, qu'un retour a la ligne normal ne saurait pas couper. */
  .lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
       opacity:.55;font-weight:700;margin-bottom:10px;
       white-space:normal;overflow-wrap:anywhere;line-height:1.35}
  button{font:inherit;color:#fff;background:rgba(255,255,255,.10);border:0;
         border-radius:14px;padding:14px 16px;width:100%;text-align:left;
         margin-bottom:8px;display:flex;align-items:center;gap:10px}
  button:active{background:rgba(255,255,255,.20)}
  /* LE BOUTON ROND EST ROND PARTOUT, pas panneau par panneau.

     La regle `button` ci-dessus donne a tout bouton la pleine largeur. La
     fleche de retour ne la corrigeait que dans les cartes (`#jeu .rond`) et
     la messagerie (`#tchat .rond`) : dans les reglages et dans le
     formulaire de reponse, rien ne la bornait, et « ← » devenait une barre
     grise qui prenait tout le haut de l'ecran. Une regle par panneau, c'est
     un panneau de plus a oublier : celle-ci vaut pour tous. */
  button.rond{width:42px;height:42px;border-radius:50%;padding:0;margin:0;
              flex:0 0 auto;display:flex;align-items:center;
              justify-content:center;text-align:center;font-size:19px;
              line-height:1}
  /* LA FLECHE EST UN DESSIN, PAS UN CARACTERE. « ← » se posait sur la ligne
     de base de la police, et chaque telephone a la sienne : la fleche
     tombait un peu bas, un peu a gauche, jamais au meme endroit. Un trait
     SVG dans une boite de 24 se centre au pixel partout, comme l'engrenage
     des reglages. */
  button.rond svg{width:20px;height:20px;display:block;flex:0 0 auto;
                  fill:none;stroke:currentColor;stroke-width:2.4;
                  stroke-linecap:round;stroke-linejoin:round}
  button.primary{background:var(--accent);color:#08102a;font-weight:800;
                 justify-content:center;text-align:center}
  .dot{width:9px;height:9px;border-radius:50%;background:#4FD68A;flex:0 0 auto}
  .taken{opacity:.45}
  input{font:inherit;width:100%;padding:14px;border-radius:14px;border:0;
        background:rgba(255,255,255,.12);color:#fff;margin-bottom:10px}
  input::placeholder{color:rgba(255,255,255,.45)}
  /* LA CASE A REMPLIR EST UNE ZONE DE TEXTE, PAS UNE LIGNE.

     Une `<input>` ne montre qu'une ligne : passe la largeur du telephone, ce
     qu'on vient d'ecrire sort par la gauche et on ne peut plus se relire. Or
     les reponses ne sont pas toutes des mots — certaines categories
     demandent une phrase, et on les tape sous chrono, donc sans relire
     ensuite. La zone de texte se replie et grandit avec son contenu
     (`autoHaut`), et elle garde l'allure d'un champ d'une ligne tant qu'il
     n'y a qu'une ligne a montrer. */
  textarea.champ{font:inherit;width:100%;padding:14px;border-radius:14px;
       border:0;background:rgba(255,255,255,.12);color:#fff;margin-bottom:10px;
       resize:none;overflow:hidden;display:block;line-height:1.4;
       min-height:50px;overflow-wrap:anywhere}
  textarea.champ::placeholder{color:rgba(255,255,255,.45)}
  .me{background:rgba(79,214,138,.16);border:1px solid rgba(79,214,138,.55)}
  .banner{background:rgba(255,154,61,.18);border:1px solid rgba(255,154,61,.6);
          border-radius:16px;padding:14px;margin-bottom:12px;font-weight:600}
  .themes{display:flex;gap:8px;flex-wrap:wrap}
  .themes button{width:auto;padding:9px 14px;border-radius:999px;margin:0}
  .err{color:#FF8A8A;font-size:13px;margin-bottom:10px}
  .foot{opacity:.4;font-size:11px;text-align:center;margin-top:26px}
  .turn{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .who{font-size:20px;font-weight:800}
  .clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
         opacity:.85}
  .gauge{height:6px;border-radius:99px;background:rgba(255,255,255,.14);
         margin:12px 0 10px;overflow:hidden}
  .gauge .fill{height:100%;background:var(--accent);border-radius:99px;
               transition:width .25s linear}
  .hint{font-size:13px;opacity:.65}
  /* L'ARDOISE PREND TOUTE LA LARGEUR : c'est la raison d'etre de cet ecran.
     Un fond sombre et uni, comme sur le telephone maitre — les traits clairs
     y sont lisibles, et un fond transparent laisserait le degrade de la page
     passer a travers la gomme. */
  .slate{background:#0D1122;border:1px solid rgba(255,255,255,.14);
         border-radius:18px;overflow:hidden;margin-bottom:12px;line-height:0}
  .board{width:100%;display:block}
  .big{font-size:30px;font-weight:800;letter-spacing:.5px;margin:6px 0 10px;
       word-break:break-word}
  .secret{background:rgba(108,155,255,.14);border-color:rgba(108,155,255,.5)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
       padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .row:last-child{border-bottom:0}
  .nom{font-weight:700}
  .pts{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
       flex:0 0 auto}
  /* UNE VALEUR QUI N'EST PAS UN NOMBRE. Au depouillement du petit bac, la
     colonne de droite porte la REPONSE, pas des points — « une phrase qui
     tue l'ambiance » n'est pas « 12 ». Posee dans une colonne qui refuse de
     retrecir (`flex:0 0 auto`), elle sortait de la carte. Celle-ci se
     replie, se partage la ligne et se coupe au besoin. */
  .pts.texte{font-size:15px;flex:1 1 auto;min-width:0;text-align:right;
       overflow-wrap:anywhere;white-space:normal;line-height:1.35}
  .row > div:first-child{min-width:0;overflow-wrap:anywhere}
  .dice{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  /* UN DE SE DESSINE EN POINTS, en trois colonnes de trois. On reconnait un
     cinq sans le lire, ce qu'un chiffre ne permet pas. */
  .de{width:54px;height:54px;border-radius:12px;background:#fff;
      display:grid;grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);padding:7px;gap:2px}
  .de .pip{width:9px;height:9px;border-radius:50%;background:transparent;
           place-self:center}
  .de .pip.on{background:#12182b}
  .de.chiffre{display:flex;align-items:center;justify-content:center;
              color:#12182b;font-size:24px;font-weight:800}

  /* LA MESSAGERIE. Transparente sur le jeu : on doit continuer a voir ce qui
     se passe derriere, sinon on ferme la fenetre a chaque fois qu'il se
     passe quelque chose — c'est-a-dire tout le temps. */
  /* `display:flex` GAGNE CONTRE `hidden` — c'est la regle CSS, pas un bug du
     navigateur — et un panneau « cache » qui reste en place intercepte tous
     les clics de la page derriere lui. */
  [hidden]{display:none !important}
  /* L'APLAT DU CLIGNOTEMENT. `pointer-events:none` est indispensable : sans
     lui, il avalerait le clic qui arrive pendant qu'il s'efface. */
  #flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;
         transition:opacity .12s linear}
  #bulle{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
         width:52px;height:52px;border-radius:50%;padding:0;margin:0;
         display:flex;align-items:center;justify-content:center;font-size:22px;
         background:rgba(255,255,255,.16);backdrop-filter:blur(8px);
         border:1px solid rgba(255,255,255,.22);z-index:20}
  #pastille{position:absolute;top:6px;right:6px;width:11px;height:11px;
            border-radius:50%;background:#FF6B6B;border:2px solid rgba(10,20,54,.8)}
  /* L'APERÇU DU DERNIER MESSAGE.

     Une pastille rouge dit qu'il s'est passe quelque chose ; elle ne dit pas
     QUOI. Pendant une partie, ouvrir la messagerie coute le jeu en cours :
     on ne le fait pas, donc on ne lit pas, donc la messagerie ne sert a rien.
     Le message se pose donc a cote de la bulle, en transparence, et s'efface
     tout seul.

     `pointer-events:none` N'EST PAS UN DETAIL : pose au-dessus de l'ecran de
     jeu, un bandeau qui avale un appui coute une manche. */
  #apercu{position:fixed;right:76px;
          bottom:calc(20px + env(safe-area-inset-bottom));
          max-width:min(62vw,250px);z-index:19;pointer-events:none;
          background:rgba(6,12,32,.62);backdrop-filter:blur(8px);
          border:1px solid rgba(255,255,255,.16);border-radius:14px;
          padding:9px 12px 10px;
          opacity:0;transform:translateY(6px);
          transition:opacity .22s ease,transform .22s ease}
  #apercu.vu{opacity:1;transform:none}
  #apercu b{display:block;color:var(--accent);font-size:11px;font-weight:800;
            letter-spacing:.4px;margin-bottom:1px}
  #apercu span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
               overflow:hidden;font-size:13.5px;line-height:1.32;
               overflow-wrap:anywhere}
  #cartes{position:fixed;right:14px;
          bottom:calc(76px + env(safe-area-inset-bottom));
          width:52px;height:52px;border-radius:50%;padding:0;margin:0;
          display:flex;align-items:center;justify-content:center;font-size:22px;
          background:rgba(255,255,255,.16);backdrop-filter:blur(8px);
          border:1px solid rgba(255,255,255,.22);z-index:20}
  #pastilleC{position:absolute;top:6px;right:6px;min-width:18px;height:18px;
             border-radius:9px;background:var(--accent);color:#08102a;
             font-size:11px;font-weight:800;font-style:normal;line-height:18px;
             text-align:center;padding:0 4px}
  #jeu{position:fixed;left:0;right:0;top:0;height:var(--vv,100dvh);max-height:var(--vv,100dvh);z-index:30;display:flex;flex-direction:column;
       background:rgba(6,12,32,.72);backdrop-filter:blur(10px);
       padding:calc(10px + env(safe-area-inset-top)) 14px
               calc(10px + env(safe-area-inset-bottom))}
  #jeu .barre{display:flex;align-items:center;gap:12px;font-weight:800;
              font-size:17px;margin-bottom:10px;flex:0 0 auto}
  #jeu .rond{width:42px;height:42px;border-radius:50%;padding:0;margin:0;
             flex:0 0 auto;display:flex;align-items:center;
             justify-content:center;font-size:19px}
  #mainC{flex:1 1 auto;overflow-y:auto;padding:4px 0}
  .carte{display:flex;gap:12px;align-items:flex-start;text-align:left;
         background:rgba(255,255,255,.10);border-radius:16px;padding:14px;
         margin-bottom:10px;width:100%;border-left:4px solid var(--accent)}
  .carte .em{font-size:28px;flex:0 0 auto;line-height:1.1}
  .carte .nom{font-weight:800;font-size:16px;margin-bottom:3px}
  .carte .eff{font-size:13px;opacity:.7;line-height:1.35}
  /* `z-index:33` : AU-DESSUS DU FORMULAIRE (32). La messagerie s'ouvre
     aussi depuis l'ecran de jeu (`bulleF`) ; en dessous, elle s'ouvrait
     invisible, derriere la grille. */
  #tchat{position:fixed;left:0;right:0;top:0;height:var(--vv,100dvh);max-height:var(--vv,100dvh);z-index:33;display:flex;flex-direction:column;
         background:rgba(6,12,32,.72);backdrop-filter:blur(10px);
         padding:calc(10px + env(safe-area-inset-top)) 14px
                 calc(10px + env(safe-area-inset-bottom))}
  #tchat .barre{display:flex;align-items:center;gap:12px;font-weight:800;
                font-size:17px;margin-bottom:10px;flex:0 0 auto}
  #tchat .rond{width:42px;height:42px;border-radius:50%;padding:0;margin:0;
               flex:0 0 auto;display:flex;align-items:center;
               justify-content:center;font-size:19px}
  #lignes{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;
          gap:8px;padding:4px 0}
  #lignes .msg{background:rgba(255,255,255,.10);border-radius:14px;
               padding:9px 12px;font-size:15px;line-height:1.35;
               word-break:break-word}
  #lignes .msg b{font-weight:800;margin-right:6px}
  #lignes .vide{opacity:.5;font-size:13px;text-align:center;margin-top:20px}
  .saisie{display:flex;gap:8px;align-items:center;flex:0 0 auto;padding-top:8px}
  .saisie input{margin:0}
  /* L'ENGRENAGE SUIT LE TITRE plutot que de flotter dans un coin. Pose en
     absolu il chevauchait le haut de l'ecran sur les telephones a encoche,
     et il ne se rattachait visuellement a rien. */
  .titre{display:flex;align-items:center;justify-content:center;gap:10px}
  .titre h1{margin:0}
  /* L'ICONE AU CENTRE DU ROND. Le bouton heritait de la regle `button` :
     `display:flex` SANS `justify-content`, donc l'icone collee a gauche, et
     une `margin-bottom` de 8px qui le decalait vers le haut par rapport au
     titre. Le glyphe « ⚙ » ajoutait son propre decalage, variable selon la
     police du telephone (texte chez l'un, emoji chez l'autre) : il est
     remplace par un dessin, centre au pixel partout. */
  .titre button{width:34px;height:34px;border-radius:50%;border:0;
                background:rgba(255,255,255,.10);color:#fff;font-size:16px;
                line-height:1;padding:0;margin:0;cursor:pointer;flex:0 0 auto;
                display:flex;align-items:center;justify-content:center}
  .titre button svg{width:18px;height:18px;display:block;fill:currentColor}
  /* LE PANNEAU S'ARRETE AU-DESSUS DU CLAVIER.

     `inset:0` mesure la fenetre de MISE EN PAGE, qui ne retrecit pas quand
     le clavier s'ouvre : le bas du panneau — donc le bouton d'envoi —
     passait dessous, et rien ne permettait d'aller le chercher. On le borne
     donc a la hauteur VISIBLE : `100dvh` la suit sur les navigateurs
     recents, et `--vv` (pose par `suivreClavier`) prend le relais partout
     ailleurs, Android compris. */
  #form{position:fixed;left:0;right:0;top:0;z-index:32;
        height:var(--vv,100dvh);max-height:var(--vv,100dvh);
        display:flex;flex-direction:column;
        background:rgba(6,12,32,.94);backdrop-filter:blur(10px);
        overflow-y:auto;-webkit-overflow-scrolling:touch;
        padding:calc(10px + env(safe-area-inset-top)) 14px
                calc(14px + env(safe-area-inset-bottom))}
  #form .barre{display:flex;align-items:center;gap:12px;font-weight:800;
               margin-bottom:12px}
  /* L'EN-TETE RESTE EN HAUT PENDANT QU'ON FAIT DEFILER LA GRILLE. Il
     defilait avec elle : des la troisieme case, le retour et la messagerie
     etaient sortis de l'ecran — le clavier fait defiler jusqu'au champ, donc
     ça arrivait a chaque manche. Meme bouchage de la marge que pour le pied
     (`::before`), meme fondu vers la grille. */
  #form .barre{position:sticky;top:0;z-index:2;margin:0 -14px 4px;
               padding:0 14px 8px;
               background:linear-gradient(#060c20 calc(100% - 8px),
                                          rgba(6,12,32,0))}
  #form .barre::before{content:"";position:absolute;left:0;right:0;
                       bottom:100%;height:calc(10px + env(safe-area-inset-top));
                       background:#060c20}
  /* LE TITRE PREND LA PLACE DU MILIEU, et la messagerie se range a droite,
     de l'autre cote du retour — le meme agencement que l'ecran du maitre. */
  #form .barre #titreF{flex:1 1 auto;min-width:0;overflow:hidden;
                       text-overflow:ellipsis;white-space:nowrap}
  #bulleF{position:relative;margin-left:auto}
  #pastilleF{position:absolute;top:2px;right:2px;width:11px;height:11px;
             border-radius:50%;background:#FF6B6B;
             border:2px solid rgba(10,20,54,.8)}
  /* « RENDRE MA COPIE » RESTE A L'ECRAN, colle en bas, la grille defilant
     au-dessus — comme la feuille du maitre. Il etait tout en bas de six
     cases : il fallait le chercher en faisant defiler, sous chrono, et c'est
     precisement le geste qui compte au petit bac (« stop ! »).

     `sticky` et pas `fixed` : le bouton reste dans le flux du panneau, dont
     la hauteur suit deja la zone visible (`--vv`) — il se pose donc sur le
     clavier quand celui-ci est ouvert, sans rien calculer. Le degrade du
     haut masque les cases qui passent dessous sans couper net.
     `scroll-padding-bottom` : quand le clavier monte, le navigateur fait
     defiler jusqu'au champ actif — sans lui, il le posait SOUS le bouton. */
  #form{scroll-padding-bottom:96px}
  #form .piedF{position:sticky;bottom:0;z-index:1;margin:0 -14px;
               padding:18px 14px 0;
               background:linear-gradient(rgba(6,12,32,0),#060c20 18px)}
  #form .piedF button{margin-bottom:0}
  /* LE BOUTON S'ARRETE A LA MARGE BASSE DU PANNEAU, pas a son bord : les
     cases defilaient dans cette bande, sous le bouton. On la bouche. */
  #form .piedF::after{content:"";position:absolute;left:0;right:0;top:100%;
                      height:calc(14px + env(safe-area-inset-bottom));
                      background:#060c20}
  #form .chrono{font-size:34px;font-weight:900;text-align:center;margin:4px 0}
  canvas.croquis{width:100%;display:block;touch-action:none}
  /* LES COULEURS DEFILENT, SEULES SUR LEUR LIGNE, et c'est exactement le
     correctif deja applique sur le telephone maitre : onze pastilles et cinq
     outils sur une meme rangee debordent de l'ecran, et ce qui depasse n'est
     pas seulement invisible — c'est intouchable. */
  .couleurs{display:flex;gap:8px;align-items:center;margin:8px 0 6px;
            overflow-x:auto;padding-bottom:4px;
            -webkit-overflow-scrolling:touch}
  .couleurs::-webkit-scrollbar{display:none}
  .outils{display:flex;gap:6px;align-items:center;margin:0 0 8px}
  .pot{width:30px;height:30px;border-radius:50%;border:2px solid
       rgba(255,255,255,.20);padding:0;cursor:pointer;flex:0 0 auto}
  .pot.actif{border-color:#fff;border-width:3px}
  .outil{width:40px;height:34px;border-radius:10px;border:1px solid
         transparent;padding:0;background:rgba(255,255,255,.12);color:#fff;
         font-size:16px;cursor:pointer;flex:0 0 auto;display:flex;
         align-items:center;justify-content:center;margin:0}
  .outil.actif{background:var(--accent);color:#08102a;
               border-color:rgba(255,255,255,.55)}
  /* L'annulation et la corbeille sont poussees a droite : ce ne sont pas des
     outils de trace, et les melanger aux trois autres fait appuyer dessus. */
  .outil.fin{margin-left:auto}
  .epais .rond{display:block;border-radius:50%;background:currentColor}
  /* LA PALETTE S'OUVRE PAR-DESSUS L'ARDOISE, derriere une pastille.

     La rangee defilante prenait une ligne entiere sous l'ardoise, et sur un
     telephone c'est la hauteur du dessin qu'elle mangeait. La pastille
     montre la couleur courante ; la palette complete apparait sur le bas de
     l'ardoise le temps d'un choix, et se referme d'elle-meme. Les pastilles
     restent des `.pot`, dans le panneau : c'est ce que les controles
     comptent. */
  /* LA ZONE OU L'ON DESSINE EST LA SEULE CHOSE COLOREE (retour du 26/09).

     Le panneau entier de l'ardoise prenait la couleur du fond, et le
     rectangle utile — aux proportions 3/4 — flottait au milieu, marque d'un
     filet presque invisible : on ne voyait pas ou l'on pouvait dessiner.
     Maintenant `.ardoise-invite` n'est qu'une boite transparente qui prend
     toute la hauteur restante du panneau (`#form.dessin`), et
     `.ardoise-zone`, posee au centre par `peindreCroquis`, a EXACTEMENT les
     proportions du dessin : fond, bord et coins arrondis delimitent ce qui
     se dessine, et rien d'autre. */
  /* LA HAUTEUR DE LA BOITE EST POSEE PAR `peindreCroquis` (retour du
     26/09, suite) : c'est la LARGEUR de l'ecran qui decide, plus la hauteur
     restante. Partager la hauteur avec la consigne, le chrono, les outils
     et les boutons donnait une ardoise d'un demi-ecran de large en « Mime ou
     Dessine ». Le joueur prefere faire defiler un peu pour atteindre les
     boutons plutot que dessiner dans un timbre-poste. Marges negatives : le
     panneau a 14 px de chaque cote, l'ardoise n'en garde que 6. */
  .ardoise-invite{position:relative;min-height:160px;margin:0 -8px 8px}
  .ardoise-zone{position:absolute;left:0;top:0;overflow:hidden;
                border-radius:16px;
                box-shadow:0 0 0 2px rgba(255,255,255,.55),
                           0 6px 22px rgba(0,0,0,.35)}
  .ardoise-zone canvas.croquis{position:absolute;left:0;top:0;
                               width:100%;height:100%}
  #form.dessin #corpsF{flex:1 0 auto;display:flex;flex-direction:column}
  #form.dessin #corpsF > *{flex:0 0 auto}
  /* LA CONSIGNE, SUR UNE LIGNE. Une carte avec son intitule au-dessus et le
     mot en corps 30 prenait cent pixels a l'ardoise ; l'intitule passe a
     gauche du mot, et le mot en corps 20. Le sous-titre explicatif saute :
     on le lit une fois, puis il ne fait que pousser l'ardoise vers le bas. */
  #form.dessin .hint.sous{display:none}
  #form.dessin .card.consigne{display:flex;align-items:baseline;gap:10px;
                              padding:7px 12px;margin-bottom:8px;
                              border-radius:14px}
  #form.dessin .consigne .lbl{margin:0;flex:0 0 auto;white-space:nowrap}
  #form.dessin .consigne .big{margin:0;font-size:20px;line-height:1.2;
                              flex:1 1 auto;min-width:0}
  /* LE CHRONO, PAR-DESSUS LE DESSIN, EN HAUT : un badge translucide que le
     doigt traverse (`pointer-events:none`) — il ne coute aucune hauteur et
     reste sous les yeux de celui qui dessine. */
  .ardoise-zone .chrono{position:absolute;top:6px;left:50%;z-index:1;
                        transform:translateX(-50%);margin:0;
                        padding:2px 10px;border-radius:99px;
                        font-size:15px;font-weight:800;line-height:1.3;
                        background:rgba(0,0,0,.32);opacity:.9;
                        pointer-events:none}
  #form .ardoise-zone .chrono{font-size:15px;margin:0}
  .ardoise-zone .chrono:empty{display:none}
  /* LE RETOUR AU CADRE ENTIER, qui n'existe que zoome. */
  .ardoise-zone .zoomRaz{position:absolute;top:6px;right:6px;z-index:1;
                         background:rgba(0,0,0,.40)}
  .ardoise-zone .zoomRaz[hidden]{display:none}
  .palette-pop{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;
               display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
               padding:12px;border-radius:16px;line-height:normal;
               background:rgba(6,12,32,.92);
               border:1px solid rgba(255,255,255,.16)}
  .palette-pop[hidden]{display:none}
  .palette-pop .pot{width:34px;height:34px;margin:0}
  .outil.couleur i{display:block;width:20px;height:20px;border-radius:50%;
                   border:2px solid rgba(255,255,255,.8)}
  /* LE CONTEXTE RESTE A L'ECRAN PENDANT QU'ON ECRIT (telephone arabe).

     Le dessin a interpreter avait une hauteur fixe, et le panneau defilait :
     quand le clavier montait, le navigateur faisait defiler jusqu'au champ,
     et le dessin — la seule chose qu'on etait venu regarder — sortait par le
     haut. Ici le panneau ne defile plus : le dessin prend ce qui reste de
     hauteur et RETRECIT quand le clavier monte, la saisie et son bouton
     restent colles au clavier. `.clavier` replie les consignes le temps de
     la frappe : c'est de la hauteur rendue au dessin. */
  #form.vue{overflow:hidden}
  #form.vue #corpsF{flex:1 1 auto;min-height:0;display:flex;
                    flex-direction:column}
  #form.vue #corpsF > *{flex:0 0 auto}
  #form.vue #corpsF > .slate.vue{flex:1 1 auto;min-height:70px;
                                  position:relative;margin-bottom:10px}
  .slate.vue canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  #form.vue .chrono:empty{display:none}
  #form.clavier .hint{display:none}
  #form.vue .card{margin-bottom:8px}
  html.formOuvert,html.formOuvert body{overflow:hidden}
  #form .chrono.court{color:#FF6B6B}
  /* LES DEUX GESTES DU JEU, COTE A COTE ET EN GRAND : on les vise sans
     regarder, un mot toutes les dix secondes, avec l'autre main occupee a
     dessiner. */
  /* PLUSIEURS RANGS SI BESOIN : en « chacun pour soi », il y a un bouton
     « trouvé par… » par devineur, et huit boutons sur une ligne feraient
     huit timbres-poste illisibles. Deux par rang, le reste suit. */
  .actes{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 4px}
  .acte{flex:1 1 0;min-width:calc(50% - 5px);justify-content:center;text-align:center;font-weight:800;
        margin:0;padding:16px 10px;border-radius:16px;
        background:rgba(255,255,255,.14)}
  .acte.ok{background:#4FD68A;color:#08210f}
  .acte.off{opacity:.45}
  #param{position:fixed;left:0;right:0;top:0;height:var(--vv,100dvh);max-height:var(--vv,100dvh);z-index:31;display:flex;flex-direction:column;
         background:rgba(6,12,32,.86);backdrop-filter:blur(10px);overflow:auto;
         padding:calc(10px + env(safe-area-inset-top)) 14px
                 calc(10px + env(safe-area-inset-bottom))}
  #param .barre{display:flex;align-items:center;gap:12px;font-weight:800;
                margin-bottom:12px}
  /* LES PANNEAUX PLEIN ECRAN SUIVENT LA ZONE VISIBLE, EN HAUT COMME EN BAS.

     Leur hauteur suivait deja le clavier (`--vv`), pas leur position : ils
     restaient accroches en haut de la fenetre de MISE EN PAGE. Or quand le
     clavier monte, iOS — et Chrome quand il ne redimensionne que la zone
     visible — fait glisser la zone visible vers le bas pour montrer le
     champ. Le panneau finissait alors avant le bas de l'ecran, et ce qu'on
     voyait dessous etait la page d'accueil, ou du blanc. `--vvt` (pose par
     `suivreClavier`) est ce decalage.

     `overscroll-behavior:contain` : arrive au bout de la liste, le doigt
     faisait defiler la page DERRIERE le panneau. */
  #jeu,#tchat,#form,#param{top:var(--vvt,0px);overscroll-behavior:contain}
  #lignes,#mainC{overscroll-behavior:contain}
</style></head><body>

<script>
(function(){
  /* ==========================================================
     A REMPLIR UNE FOIS, AVANT DE PUBLIER CETTE PAGE.

     Les deux memes valeurs que les `--dart-define` de
     l'application : Project Settings -> API dans Supabase.

     La cle publiable est FAITE pour etre publique — elle part
     de toute façon dans cette page, que n'importe qui peut
     lire. Elle ne donne le droit que de parler sur un canal
     dont il faut connaitre le code. Ne jamais mettre ici la
     cle « secret » / `service_role`.
     ========================================================== */
  var CONFIG = {
    url: 'https://dbwizgashfeilqvskrlq.supabase.co',
    key: 'sb_publishable_d7A771bERUS5OLsALlc_kA_wZPQTDjg',
    /* LE TUYAU. Vide = relais Supabase (cette page, publiee sur le web).

       `lan` quand c'est le TELEPHONE MAITRE qui sert cette page sur le
       Wi-Fi local : il remplace cette valeur au vol en la servant. Une
       seule page pour les deux modes, et c'est une correction d'erreur
       autant qu'une economie — il y en avait deux, une ici et une copiee
       dans `party_server.dart`, et elles avaient deja commence a diverger.
       Le dessin en direct n'existait que dans celle-ci. */
    mode: ''
  };

  /* LE STOCKAGE PEUT LEVER — navigation privee, site bloque. Une exception
     dans un gestionnaire de clic annulerait le geste lui-meme : on
     degraderait la memoire du choix, pas la possibilite de choisir. */
  var S = (function(){
    var raw = window.localStorage;
    return {
      getItem: function(k){ try { return raw.getItem(k); } catch(e){ return null; } },
      setItem: function(k,v){ try { raw.setItem(k,v); } catch(e){} },
      removeItem: function(k){ try { raw.removeItem(k); } catch(e){} }
    };
  })();
  var app = document.getElementById('app');

  /* LE CODE DU SALON : dans le chemin (/j/AB12C) OU en parametre
     (?c=AB12C).

     Le second n'est pas un caprice : il permet d'ouvrir cette page
     depuis un simple fichier local, sans hebergement ni reecriture
     d'URL, donc de l'essayer avant d'avoir un domaine. */
  function readCode(){
    var q = new URLSearchParams(location.search).get('c');
    if(q) return q.trim().toUpperCase();
    var m = location.pathname.match(/\/j\/([^\/?#]+)/i);
    return m ? decodeURIComponent(m[1]).trim().toUpperCase() : '';
  }

  /* EN WI-FI, LE CODE NE COMPTE PAS — ET IL NE DOIT PAS ENTRER DANS LES
     CLES DE RANGEMENT.

     Ce telephone-la ne sert qu'un salon, le sien : le code ne nomme rien.
     Mais il servait quand meme a fabriquer la cle du SECRET, et le secret
     fabrique l'identifiant de l'appareil. Ouvrir la page par l'adresse nue
     puis par le QR (`/j/AB12C`) donnait donc deux secrets, donc deux
     identifiants, donc DEUX APPAREILS CONNECTES pour un seul telephone —
     et le compte grimpait a chaque forme d'adresse essayee. */
  var code = CONFIG.mode === 'lan' ? '' : readCode();
  /* LE MOT DE PASSE EST RANGE PAR SALON. Une seule cle pour tous les
     salons, et l'invite qui va d'une soiree a l'autre envoie le mot de
     passe de la precedente — que le maitre ignore en silence. */
  var passKey = 'pivvy_pass_' + (code || 'lan');
  var pass = S.getItem(passKey) || '';

  /* LE JOUEUR QU'ON A CHOISI, garde ici et pas seulement dans l'etat recu.
     Un appareil peut disparaitre un moment de la liste des presents — un
     navigateur mobile gele ses minuteurs des que l'ecran s'eteint — et
     l'ecran ne doit surtout pas repartir a la selection pour autant. On
     tient donc notre choix, et on le REVENDIQUE A NOUVEAU si le maitre
     semble l'avoir oublie. */
  var claimKey = 'pivvy_joueur_' + (code || 'lan');
  var myClaim = S.getItem(claimKey) || null;

  var state = null, err = '', adding = false, askPass = false;
  var draft = '', nameDraft = '';
  var lastKey = '', lastBlur = 0;

  /* LE MOT PRIVE EST CACHE PAR DEFAUT, et se redevoile a la demande. Un
     telephone passe de main en main, on se penche sur l'ecran du voisin :
     un mot secret affiche en permanence n'est plus secret. */
  var devoile = false;
  var channel = null, joined = false, beat = null;

  /* L'INTENTION EN ATTENTE : ce qu'on a demande, et quand.
     Sur un canal de diffusion le maitre ne repond pas « non » — il
     applique, ou il ignore. La seule façon de savoir qu'une intention a
     ete refusee est donc de la surveiller et de constater qu'elle n'a
     rien change. Encore faut-il savoir CE QU'ELLE aurait du changer :
     d'ou le type, sans lequel un « ce n'est pas moi » reussi passerait
     pour un mot de passe refuse. */
  var pending = null;

  /* ============================================================
     LA SCENE : la partie, vue depuis ce telephone-ci.
     ============================================================

     LE BUT N'EST PAS QUE CHACUN JOUE DANS SON COIN. Ce serait huit parties
     solitaires dans le meme salon, et personne ne leverait plus les yeux.
     C'est l'inverse : cet ecran est une SECONDE VUE sur la partie qui se
     joue au milieu de la table. L'ardoise du dessinateur fait dix
     centimetres et six personnes se penchent dessus ; ici elle occupe
     l'ecran entier.

     ON NE RECOIT PAS UNE IMAGE, on recoit la RECETTE du dessin : des points,
     une couleur, une epaisseur, et pour un remplissage l'endroit ou le pot a
     ete verse. C'est la regle dure du protocole (`transport.dart`) et c'est
     aussi la seule qui tienne — un canal de diffusion ne transporte pas
     trente images par seconde.

     ET ON RECOIT LA FIN, PAS LE TOUT. Les elements deja recus ne changent
     plus, sauf le dernier qui peut encore grandir tant que le doigt trace :
     le maitre n'envoie donc que ce qui suit. `ep` numerote l'epoque — une
     ardoise effacee, un mot suivant — et des qu'elle change, tout ce qu'on
     tient est perime. */
  var scene = null;        // la partie legere : qui dessine, le chrono…
  var sceneItems = [];     // les traits et remplissages, cumules
  var sceneEpoch = -1;
  /* La derniere signature peinte dans le DOM. Voir `signature`. */
  var lastSigne = '';
  /* Le resultat du dernier envoi sur le relais. Affiche dans les reglages :
     c'est la seule façon de distinguer « ça n'est pas parti » de « ça a ete
     refuse a l'arrivee ». */
  var dernierEnvoi = '—';
  /* Quand la derniere partie s'est arretee. Voir `onScene`. */
  var interrompu = 0;
  /* Le jeu annonce par le dernier etat, pour voir quand il change. */
  var jeuVu = null;
  var askedAt = 0;         // derniere resynchronisation demandee

  /* Ce qui est deja peint sur le calque hors ecran : tous les elements sauf
     le dernier, qui bouge encore. Voir `paintScene`. */
  var sceneDone = 0;

  /* Le dernier geste que le maitre a ignore. Voir l'ecran du mot de passe :
     une fois celui-ci corrige, c'est CE geste qu'il faut refaire, et pas un
     simple bonjour. */
  var refused = null;

  /* Un signe de vie toutes les huit secondes.
     LE MAITRE OUBLIE UN APPAREIL QUI SE TAIT (25 s, voir `PartyController`),
     et il ne compte que ce qu'il RECOIT : c'est un message qui prouve la
     presence, pas une connexion ouverte. La page Wi-Fi n'avait pas ce
     probleme sans le savoir — son sondage toutes les 2,5 s faisait office
     de signe de vie. Ici il n'y a plus de sondage, donc il faut le dire
     explicitement, sinon l'invite disparait de la liste au bout de vingt-
     cinq secondes et l'ecran le renvoie choisir son joueur. */
  /* L'EMPREINTE DE CETTE PAGE. Posee par `tools/build_guest_page.js`.

     La page Wi-Fi est servie par l'appli : elle ne peut pas etre en retard.
     La page 4G, elle, est hebergee ailleurs et se televerse a la main — et
     rien ne disait qu'elle etait restee en arriere. Une soiree entiere a ete
     passee a chercher un bug de reseau deja corrige dans le depot, mais qui
     tournait encore chez l'hebergeur.

     Le maitre diffuse l'empreinte qu'il attend (`pv`). Quand elle ne
     correspond pas, la page le dit elle-meme, en haut de l'ecran. */
  var PAGE_VERSION = '2b105402';

  var HEARTBEAT_MS = 8000;

  /* Combien de temps on laisse a une intention avant de s'en inquieter.
     Le maitre rediffuse toutes les deux secondes et repond immediatement a
     une intention traitee : cinq secondes sont largement au-dessus du cas
     normal. */
  var PENDING_MS = 5000;

  /* ON REESSAIE AVANT D'ACCUSER, et c'est le vrai correctif.

     L'ancienne version passait du silence a « le salon n'a pas pris en
     compte ton choix » en une seule etape. C'etait un raisonnement faux :
     sur un canal de diffusion, RIEN N'EST GARANTI — ni l'aller ni le
     retour. Un message perdu, un relais lent, une seconde de 4G qui
     s'accroche, et l'invite se faisait accuser d'un mot de passe qui
     n'existait pas ; puis, comme le geste etait annule, il ne pouvait plus
     choisir son joueur du tout.

     Une intention est donc REJOUEE une fois avant qu'on en tire une
     conclusion. C'est sans danger : le maitre est l'autorite et les
     intentions sont idempotentes — « je suis Lea » deux fois, c'est
     toujours Lea. Et on ne parle de mot de passe que si le salon a dit
     qu'il en avait un (`lock`) ; sinon on dit ce qui s'est reellement
     passe, c'est-a-dire que ça n'est pas passe. */
  var RETRY_MS = 2500;

  var THEMES = {
    minuit:['#0A1436','#16409B','#050B22','#6C9BFF'],
    aurore:['#1B0B3B','#6B2E9C','#120627','#C084FF'],
    neon:  ['#05070E','#16203A','#03040A','#2BE8C5'],
    braise:['#200705','#521A0D','#140403','#FF8A5B']
  };
  function applyTheme(name){
    var t = THEMES[name] || THEMES.minuit;
    var r = document.documentElement.style;
    r.setProperty('--bg1',t[0]); r.setProperty('--bg2',t[1]);
    r.setProperty('--bg3',t[2]); r.setProperty('--accent',t[3]);
    S.setItem('pivvy_theme', name);
  }
  applyTheme(S.getItem('pivvy_theme') || 'minuit');

  /* ------------------------------------------------------------------
     LE SECRET DE CET APPAREIL

     Trois jeux donnent a chacun quelque chose que les autres ne doivent pas
     lire : le mot de l'infiltre, le mot interdit, la mission secrete. Or le
     salon DIFFUSE — chaque message part a tous. Envoyer ces mots en clair
     reviendrait a les donner a tout le monde : il suffirait d'ouvrir la
     console pour lire le mot de l'infiltre, et le jeu n'existerait plus.

     Cet appareil tire donc un secret au hasard, le garde, et le donne au
     maitre avec ses intentions. Le maitre chiffre notre part avec. Les
     autres recoivent les octets et n'en font rien.

     CE N'EST PAS DE LA CRYPTOGRAPHIE et il ne faut pas le presenter
     autrement : un xorshift 32 bits et un ou-exclusif. Ce que ça arrete,
     c'est le seul adversaire reel ici — l'invite curieux qui ouvre la
     console pendant la partie. Voir `lib/core/secret_wire.dart` : les deux
     implementations doivent s'accorder au bit pres, et les vecteurs d'essai
     sont le contrat. */
  var secKey = 'pivvy_secret_' + (code || 'lan');
  var secret = S.getItem(secKey);
  if(!secret){
    secret = '';
    var alpha = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    for(var si = 0; si < 32; si++){
      secret += alpha.charAt(Math.floor(Math.random() * alpha.length));
    }
    S.setItem(secKey, secret);
  }
  /* L'identifiant DECOULE du secret : il n'est plus range nulle part, et il
     ne peut plus etre le sien sans avoir le secret qui va avec. */
  var dev = idDepuis(secret);

  /* L'IDENTIFIANT DE CET APPAREIL, DERIVE DU SECRET.

     Il etait tire au hasard et rangé a part. C'etait une faille, et pas une
     petite : le champ `f` d'un message est ecrit par l'expediteur, et les
     identifiants de tout le monde sont diffuses en clair dans `claims`.
     N'importe qui pouvait envoyer un bonjour signe du nom d'un autre, imposer
     SON secret a l'appareil du voisin, et lire ensuite la main du voisin —
     pendant que le voisin ne savait plus lire la sienne.

     L'identifiant est maintenant une empreinte du secret, et le maitre refuse
     tout message dont le `f` ne correspond pas au secret fourni. Usurper
     quelqu'un demande de deviner ses trente-deux caracteres. */
  function idDepuis(cle){
    var h = 0x811c9dc5, b = octets(cle);
    for(var i = 0; i < b.length; i++){
      h = (h ^ b[i]) >>> 0;
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    var st = (h | 1) >>> 0, out = '';
    for(var k = 0; k < 3; k++){
      st = (st ^ (st << 13)) >>> 0;
      st = (st ^ (st >>> 17)) >>> 0;
      st = (st ^ (st << 5)) >>> 0;
      out += ('0000000' + st.toString(16)).slice(-8);
    }
    return out.slice(0, 16);
  }

  function octets(str){
    /* `TextEncoder` fait ça, et n'existe pas partout ou cette page doit
       tourner. Le brouillage travaille sur des OCTETS UTF-8, pas sur des
       caracteres : confondre les deux marche parfaitement en anglais et
       casse sur le premier « é », c'est-a-dire sur presque tous les mots du
       jeu. */
    var utf = unescape(encodeURIComponent(str));
    var out = [];
    for(var i = 0; i < utf.length; i++) out.push(utf.charCodeAt(i) & 255);
    return out;
  }
  function texte(bytes){
    var s2 = '';
    for(var i = 0; i < bytes.length; i++) s2 += String.fromCharCode(bytes[i]);
    try { return decodeURIComponent(escape(s2)); } catch(e){ return s2; }
  }
  function flot(cle, n){
    var h = 0x811c9dc5;
    var b = octets(cle);
    for(var i = 0; i < b.length; i++){
      h = (h ^ b[i]) >>> 0;
      /* `Math.imul` ET PAS `*`. En JavaScript, `h * 0x01000193` passe par un
         flottant sur cinquante-trois bits et perd les bits de poids faible
         des que le produit depasse : le resultat s'ecarterait de celui du
         Dart sans rien signaler. `Math.imul` fait la multiplication 32 bits
         exacte, celle que fait le Dart. */
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    var st = (h | 1) >>> 0, out = [];
    for(var k = 0; k < n; k++){
      st = (st ^ (st << 13)) >>> 0;
      st = (st ^ (st >>> 17)) >>> 0;
      st = (st ^ (st << 5)) >>> 0;
      out.push(st & 255);
    }
    return out;
  }
  function sceller(cle, str){
    var b = octets(str), k = flot(cle, b.length), out = '';
    for(var i = 0; i < b.length; i++) out += String.fromCharCode(b[i] ^ k[i]);
    return btoa(out);
  }
  function ouvrir(cle, sceau){
    try{
      var brut = atob(sceau), k = flot(cle, brut.length), out = [];
      for(var i = 0; i < brut.length; i++){
        out.push((brut.charCodeAt(i) & 255) ^ k[i]);
      }
      return texte(out);
    }catch(e){ return null; }
  }

  function el(tag, cls, txt){
    var e=document.createElement(tag); if(cls)e.className=cls;
    if(txt!=null)e.textContent=txt; return e;
  }

  // ---------------------------------------------------------- protocole

  /* L'ENVELOPPE, IDENTIQUE A `PartyMessage` COTE DART.
     Trois cles courtes, dans cet ordre : type, emetteur, donnees.
     Un seul caractere de decalage et les deux cotes ne se
     comprennent plus — sans erreur, sans trace, juste un salon ou
     personne n'arrive. */
  function encode(type, data){
    return JSON.stringify({ t: type, f: dev, d: data || {} });
  }

  function decode(raw){
    try{
      var j = JSON.parse(raw);
      if(!j || typeof j !== 'object') return null;
      return { type: j.t || '', from: j.f || '', data: j.d || {} };
    }catch(e){ return null; }
  }

  /* SORT LE CONTENU DE L'ENVELOPPE, quelle qu'elle soit.
     Selon la version de la bibliotheque, le rappel recoit soit ce que
     l'expediteur a envoye, soit l'enveloppe complete qui le contient.
     Meme prudence que du cote Dart (`RelayTransport.unwrap`). */
  function unwrap(payload){
    if(!payload) return null;
    if(typeof payload.b === 'string') return payload.b;
    if(payload.payload && typeof payload.payload.b === 'string'){
      return payload.payload.b;
    }
    return null;
  }

  /* LES GESTES DE JEU ET LES MESSAGES PASSENT PAR LA BOITE D'ENVOI (voir
     `poster`) : ils doivent ARRIVER, et un seul essai ne le garantit pas.
     Tout le reste — bonjour, revendication, resynchronisation — part tel
     quel : son effet se lit dans l'etat, et il a deja sa surveillance. */
  function send(type, data){
    if(type === 'act' || type === 'chat'){ poster(type, data); return; }
    emettre(type, data);
  }

  function emettre(type, data){
    if(!joined || !tuyau) return;
    /* LE SECRET VOYAGE AVEC CHAQUE INTENTION, comme le mot de passe et pour
       la meme raison : sur un canal de diffusion il n'y a pas de
       « connexion » ou le deposer une fois. Le maitre retient le dernier
       recu pour cet appareil. */
    var body = Object.assign({ pass: pass, k: secret }, data || {});
    tuyau.send(encode(type, body));
  }

  function intent(type, data){
    /* UN GESTE DE JEU N'EST PAS UNE INTENTION EN ATTENTE. Son effet ne se
       lit pas dans l'etat du salon — `satisfied` le declarait donc
       satisfait au premier etat recu, sans rien verifier. Pire, il ECRASAIT
       l'intention en vol : un « trouve » appuye pendant une revendication
       effaçait la surveillance de celle-ci. Sa garantie a lui, c'est
       l'accuse du maitre (voir `poster`). */
    if(type === 'act' || type === 'chat'){ send(type, data); return; }
    /* « Ce n'est pas moi » : ce qui restait a envoyer etait signe du joueur
       qu'on vient de lacher. */
    if(type === 'leave') sortants = [];
    /* `hello` n'est PAS surveille : il ne change rien d'observable dans
       l'etat, donc l'attendre reviendrait a lever une alerte a chaque
       fois. Un mot de passe faux se decouvre au premier vrai geste. */
    if(type !== 'hello'){
      pending = { kind: type, player: (data || {}).player || null,
                  data: data || {}, at: Date.now() };
    }
    send(type, data);
  }

  /* L'etat recu satisfait-il l'intention en attente ? */
  function satisfied(st){
    if(!pending) return true;
    var mine = (st && st.claims) ? st.claims[dev] : null;
    if(pending.kind === 'claim') return mine === pending.player;
    if(pending.kind === 'add') return !!mine;
    if(pending.kind === 'leave') return !mine;
    return true;
  }

  /* ------------------------------------------------------------------
     LA BOITE D'ENVOI : CE QUI DOIT ARRIVER, ARRIVE.

     L'etat va du maitre vers nous et se rediffuse entier toutes les deux
     secondes : ce qui se perd revient au battement suivant. Les GESTES vont
     dans l'autre sens et partaient UNE fois. D'ou la soiree du telephone
     arabe : une copie rendue s'est perdue en route — une seconde de 4G, le
     telephone maitre dont l'ecran s'etait eteint, un envoi parti pendant que
     notre propre connexion se retablissait et donc jete sans un mot — la page
     affichait « ta reponse est partie, on attend les autres », le maitre
     attendait toujours ce joueur, et personne ne pouvait le savoir.

     CHAQUE GESTE PORTE DONC UN NUMERO (`i`), et reste ici jusqu'a ce que
     l'etat du maitre le cite dans `ack[notre appareil]`. Tant qu'il n'y est
     pas, il repart toutes les deux secondes, et d'un coup a la reconnexion.
     Le maitre reconnait un numero deja vu : il le re-accuse sans le rejouer
     — une carte envoyee deux fois n'est jouee qu'une fois.

     SEULEMENT SI LE MAITRE SAIT ACCUSER. Il l'annonce en publiant `ack`,
     meme vide. Devant un maitre plus ancien, rien ne serait jamais accuse et
     chaque renvoi serait rejoue : on envoie alors une fois, comme avant.

     CE QUI SE REMPLACE NE S'EMPILE PAS. Le dessin en direct et le brouillon
     du petit bac portent a chaque envoi l'etat COMPLET : seul le dernier
     compte, et renvoyer un ancien apres un recent ferait reculer le dessin.
     Une copie rendue efface les brouillons de la meme manche encore en vol,
     pour la meme raison. */
  var sortants = [];
  var sortantSeq = 0;
  /* Un prefixe tire a chaque chargement : le compteur repart de zero au
     rechargement, et le maitre prendrait les nouveaux numeros pour des
     doublons. */
  var sortantTag = Math.random().toString(36).slice(2, 7);
  var RESEND_MS = 2000;
  /* Au-dela, on renonce : un geste vieux de dix minutes ne concerne plus la
     partie en cours. Assez long pour un maitre qui a pose son telephone le
     temps que tout le monde dessine. */
  var OUTBOX_MAX_MS = 10 * 60 * 1000;
  var OUTBOX_MAX = 40;

  function accuse(){
    return !!(state && state.ack && typeof state.ack === 'object');
  }

  function remplace(type, d){
    if(type !== 'act' || !d) return null;
    if(d.a === 'croquis') return 'croquis|' + d.f;
    if(d.a === 'form' && d.d) return 'brouillon|' + d.f;
    return null;
  }

  function poster(type, data){
    var d = data || {};
    if(!accuse()){ emettre(type, d); return; }
    var cle = remplace(type, d);
    var jeter = cle
      || ((type === 'act' && d.a === 'form' && !d.d) ? 'brouillon|' + d.f : null);
    if(jeter){
      sortants = sortants.filter(function(o){ return o.cle !== jeter; });
    }
    var id = sortantTag + '.' + (++sortantSeq).toString(36);
    var o = { id: id, type: type, data: Object.assign({}, d, { i: id }),
              cle: cle, at: Date.now(), last: 0 };
    sortants.push(o);
    if(sortants.length > OUTBOX_MAX) sortants.shift();
    pousser(o);
  }

  /* Deconnecte, on n'envoie pas : `last` reste a zero, et `relancer(true)`
     le fera partir des que le tuyau revient. */
  function pousser(o){
    if(!joined || !tuyau) return;
    o.last = Date.now();
    emettre(o.type, o.data);
  }

  function relancer(tout){
    var now = Date.now();
    sortants = sortants.filter(function(o){ return now - o.at < OUTBOX_MAX_MS; });
    sortants.forEach(function(o){
      if(tout || now - o.last >= RESEND_MS) pousser(o);
    });
  }

  function lireAccuses(st){
    var liste = (st && st.ack) ? st.ack[dev] : null;
    if(!liste || !liste.length || !sortants.length) return;
    sortants = sortants.filter(function(o){ return liste.indexOf(o.id) < 0; });
  }

  /* LA COPIE DE CE FORMULAIRE EST-ELLE ENCORE EN ROUTE ? Pour l'ecran : « ta
     reponse est partie » ne doit se dire qu'une fois le maitre l'a reçue. */
  function copieEnVol(fid){
    return sortants.some(function(o){
      return o.type === 'act' && o.data.a === 'form' && !o.data.d
          && o.data.f === fid;
    });
  }

  setInterval(function(){ if(sortants.length) relancer(false); }, 500);

  // ------------------------------------------------------------ canal

  /* ------------------------------------------------------------------
     LE TUYAU

     DEUX TUYAUX, UNE SEULE PAGE. C'est le meme protocole des deux cotes —
     les memes enveloppes, les memes intentions, les memes ecrans — et
     seule la façon dont les octets circulent change :

       - RELAIS : un canal de diffusion Supabase. Marche en 4G, donc
         partout, mais demande un projet configure ;
       - WI-FI : le telephone maitre sert lui-meme cette page et pousse les
         messages en SSE. Zero infrastructure, mais tout le monde sur le
         meme reseau.

     Un tuyau expose trois choses : `start`, `send(raw)`, et il appelle
     `recu(raw)` quand quelque chose arrive. Rien d'autre ne les distingue,
     et rien au-dessus ne sait lequel est branche.
     ------------------------------------------------------------------ */
  var tuyau = null;

  function recu(raw){
    var m = decode(raw);
    /* On ignore ses propres messages : selon la configuration du canal, le
       serveur peut les renvoyer a l'expediteur. */
    if(!m || m.from === dev) return;
    onMessage(m);
  }

  function ouvert(){
    joined = true; err = '';
    send('hello', {});
    /* ET ON REDEMANDE LA SCENE : un invite qui revient apres une coupure a
       pu rater le debut d'un tour, et le maitre ne rediffuse une scene que
       quand elle change. Sans cette demande, il restait sur le formulaire
       d'avant, deja rendu, pendant que le maitre l'attendait. */
    askResync();
    /* CE QUI ATTENDAIT LE TUYAU PART MAINTENANT, sans attendre la relance :
       c'est justement pendant la coupure qu'on a appuye. */
    relancer(true);
    startBeat();
    render(1);
  }

  function ferme(message){
    joined = false;
    stopBeat();
    err = message || 'Connexion au salon perdue. Nouvel essai…';
    render(1);
  }

  /* LA BIBLIOTHEQUE SUPABASE N'EST CHARGEE QUE SI ON S'EN SERT.

     Elle etait dans une balise `<script src>` en tete de page. En Wi-Fi
     local, le telephone de l'invite n'a souvent AUCUN acces a internet — le
     seul interet de ce reseau, ici, est de le relier au telephone d'a cote —
     et le navigateur attendait ce fichier qui n'arriverait jamais avant
     d'afficher quoi que ce soit. */
  function chargerSupabase(suite){
    if(window.supabase) return suite();
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = suite;
    s.onerror = function(){
      ferme('Impossible de charger la bibliotheque du relais. '
            + 'Verifie la connexion internet de ce telephone.');
    };
    document.head.appendChild(s);
  }

  function relayTuyau(){
    var client = window.supabase.createClient(CONFIG.url, CONFIG.key);
    channel = client.channel('party-' + code, {
      /* `ack` demande au serveur de confirmer chaque diffusion. Sans lui,
         `send` rend « ok » des qu'il a confie le message a la bibliotheque,
         ce qui ne prouve rien. */
      config: { broadcast: { ack: true, self: false } },
    });
    channel.on('broadcast', { event: 'm' }, function(msg){
      var raw = unwrap(msg && msg.payload ? msg.payload : msg);
      if(raw) recu(raw);
    });
    return {
      start: function(){
        channel.subscribe(function(status){
          if(status === 'SUBSCRIBED') ouvert();
          else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') ferme();
        });
      },
      send: function(raw){
        /* ON REGARDE CE QUE RENDENT LES ENVOIS.

           Il etait ignore, et c'est la piece d'information qui manquait a
           trois diagnostics : quand un geste reste sans effet, on ne savait
           pas s'il n'etait PAS PARTI ou s'il avait ete REFUSE a l'arrivee.
           Ce sont deux pannes opposees — l'une chez l'invite, l'autre chez le
           maitre — et on les cherchait toutes les deux au meme endroit.

           `ack: true` (voir la creation du canal) fait que « ok » signifie
           vraiment « le serveur l'a pris », et non « je l'ai confie a la
           bibliotheque ». Le resultat s'affiche dans les reglages. */
        try{
          var r = channel.send({ type:'broadcast', event:'m',
                                 payload:{ b: raw } });
          if(r && typeof r.then === 'function'){
            r.then(function(st){ dernierEnvoi = String(st); },
                   function(e){ dernierEnvoi = 'erreur : ' + e; });
          } else if(r){
            dernierEnvoi = String(r);
          }
        }catch(e){ dernierEnvoi = 'erreur : ' + e; }
      }
    };
  }

  /* LE TUYAU WI-FI : SSE pour recevoir, POST pour envoyer.

     POURQUOI PAS UN SONDAGE, qui etait la solution precedente. Il tournait
     toutes les deux secondes et demie — largement assez pour une liste de
     joueurs, et sans aucun rapport avec un trait qui se trace. Le dessin en
     direct demande dix messages par seconde ; sonder a cette cadence serait
     dix requetes par seconde et par invite, sur un telephone qui fait deja
     tourner la soiree.

     Le SSE est du HTTP ordinaire : une reponse qui ne se termine pas. Le
     navigateur reconnecte tout seul quand elle tombe, ce qui couvre
     l'ecran qu'on eteint et le Wi-Fi qui vacille. */
  function lanTuyau(){
    var flux = null, mort = null;
    function brancher(){
      if(flux){ try{ flux.close(); }catch(e){} }
      flux = new EventSource('/api/events?d=' + encodeURIComponent(dev)
                             + '&c=' + encodeURIComponent(code));
      flux.onopen = function(){ if(mort){ clearTimeout(mort); mort = null; } ouvert(); };
      flux.onmessage = function(e){ if(e && e.data) recu(e.data); };
      flux.onerror = function(){
        /* PAS DE PANIQUE IMMEDIATE : `EventSource` reconnecte tout seul, et
           afficher « connexion perdue » a chaque hoquet ferait clignoter
           l'ecran pour rien. On ne le dit que si ça ne revient pas. */
        if(mort) return;
        mort = setTimeout(function(){ mort = null; ferme(); }, 4000);
      };
    }
    return {
      start: brancher,
      send: function(raw){
        try{
          fetch('/api/msg', { method:'POST', body: raw,
                              headers:{'Content-Type':'text/plain'} })
            .catch(function(){});
        }catch(e){}
      }
    };
  }

  function connect(){
    var lan = CONFIG.mode === 'lan';
    if(!lan && (!CONFIG.url || !CONFIG.key)){
      err = 'Cette page n’est pas configuree : il manque l’adresse '
          + 'du projet et la cle. Voir le bloc CONFIG en haut du fichier.';
      render(1); return;
    }
    /* EN WI-FI IL N'Y A PAS DE CODE DANS L'ADRESSE, et il n'en faut pas :
       ce telephone-la ne sert qu'un salon, le sien. Le code sert a nommer un
       canal partage, ce que le relais a et que le Wi-Fi n'a pas. */
    if(!code && !lan){
      err = 'Aucun code de salon dans l’adresse. Le QR code de la soiree '
          + 'ouvre la bonne page ; sinon, ajouter ?c=CODE a la fin.';
      render(1); return;
    }
    if(lan){
      tuyau = lanTuyau();
      tuyau.start();
      return;
    }
    chargerSupabase(function(){
      tuyau = relayTuyau();
      tuyau.start();
    });
  }

  function onMessage(m){
    if(m.type === 'state'){
      state = m.data;
      lireAccuses(state);
      /* ON NE FERME PAS L'ECRAN DU MOT DE PASSE SUR UN ETAT RECU.
         Le maitre rediffuse l'etat a TOUT LE CANAL toutes les deux
         secondes, mot de passe ou pas : le refermer ici detruisait le
         champ deux secondes apres l'avoir ouvert, et le mot de passe
         devenait impossible a taper. Il ne se ferme que sur une
         intention qui aboutit, ou quand l'invite valide. */
      if(pending && satisfied(state)){
        learnClaim();
        pending = null;
        askPass = false;
        err = '';
      }
      if(!pending && !askPass) err = '';
      /* UN NOUVEAU JEU EFFACE L'INTERRUPTION DU PRECEDENT.

         Le message ne s'effaçait qu'a l'arrivee d'une nouvelle SCENE. Or un
         jeu qui vient de s'ouvrir n'en publie pas forcement tout de suite —
         la chasse express reste d'abord sur ses reglages — et les invites
         lisaient « la manche a ete interrompue » pendant que le jeu suivant
         demarrait visiblement sur le telephone principal. */
      if(interrompu && state.game !== jeuVu){ interrompu = 0; }
      jeuVu = state.game || null;
      reclaim();
      render();
      majTchat();
      majJeu();
    } else if(m.type === 'scene'){
      onScene(m.data);
    } else if(m.type === 'bye'){
      state = null;
      pending = null;
      sortants = [];
      stopBeat();
      err = 'La soiree est terminee.';
      resetScene();
      render(1);
      /* LES DEUX FENETRES VIVENT HORS DE `#app`, donc `render` ne les touche
         pas : sans ces deux lignes, le panneau des cartes restait ouvert
         par-dessus « la soiree est terminee », avec des cartes injouables. */
      majTchat();
      majJeu();
      fermerForm(true);
      formVu = null;
      /* ET LES REGLAGES, pour la meme raison exactement : ils vivent hors de
         `#app` et passent AU-DESSUS de tout. Laisses ouverts, ils cachaient
         « la soiree est terminee » derriere un panneau dont le bouton
         « ce n'est pas moi » envoyait encore des intentions dans un salon
         ferme. Sans depiler l'historique : la soiree est finie, on ne
         navigue plus. */
      fermerParam(true);
    }
  }

  function resetScene(){
    scene = null; sceneItems = []; sceneEpoch = -1; sceneDone = 0;
    lastSigne = '';
    /* `interrompu` est repose par l'appelant quand c'est une interruption.
       Ici on l'efface, parce que `resetScene` sert aussi a la fin de soiree —
       et « la manche a ete interrompue » par-dessus « la soiree est
       terminee » raconte deux choses differentes du meme evenement. */
    interrompu = 0;
    devoile = false;
    if(committed){ committed.width = committed.width; }
  }

  /* RECOLLE LA QUEUE RECUE A CE QU'ON TIENT DEJA.

     Trois cas seulement, et le troisieme est la raison d'etre de tout le
     mecanisme :
       - epoque differente : on repart de zero, et il FAUT que l'envoi
         commence a zero, sinon on ne sait pas de quoi il est la suite ;
       - l'envoi commence apres la fin de ce qu'on a : il nous manque un
         morceau, perdu en route — un canal de diffusion ne garantit rien ;
       - sinon : on remplace a partir de `i0`, et c'est le cas courant.

     Dans les deux premiers cas on ne devine pas : on demande au maitre de
     tout renvoyer. C'est rare, et c'est le prix de ne rien recevoir en trop
     le reste du temps. */
  function onScene(d){
    if(!d || d.sc === null || d.sc === undefined){
      /* LA PARTIE S'EST ARRETEE, ET IL FAUT LE DIRE.

         La scene disparaissait sans un mot : l'ecran revenait a « en attente
         du lancement d'un jeu », ou pire — quand la page ne se redessinait
         pas — restait sur le dernier ecran avec un chrono fige. Un chrono
         arrete ressemble a une panne de reseau, pas a une manche
         interrompue, et c'est le maitre qu'on va secouer.

         Le message ne dure pas : le jeu suivant l'efface en arrivant. */
      var avait = scene !== null;
      resetScene();
      /* ET ON FERME LE FORMULAIRE. Ce chemin sort AVANT le `majForm()` de la
         fin, donc rien ne le refermait : quitter le jeu, appuyer sur
         « recommencer » ou perdre le dernier invite laissait un formulaire
         plein ecran par-dessus tout, avec un bouton d'envoi encore vivant.
         L'invite le remplissait, l'envoyait dans le vide, et se retrouvait
         marque comme ayant repondu — ce qui le bloquait pour la manche
         suivante. Le chemin `bye` le faisait deja ; celui-ci avait ete
         oublie. */
      fermerForm(true);
      formVu = null;
      /* ET LE DIRECT SE COUPE. Ce chemin sort avant `majForm()`, donc la
         branche « plus de formulaire » ne passait pas : un envoi de croquis
         deja arme partait apres la fin de la partie, et l'ecouteur de souris
         le reamorcait a chaque relachement. */
      liveId = null;
      if(liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
      if(avait){
        interrompu = Date.now();
        render(1);
      }
      return;
    }
    interrompu = 0;
    var etait = screenKey();
    scene = d.sc;
    var i0 = d.i0 || 0, tail = d.it || [], n = d.n || 0;
    var neuf = (d.ep !== sceneEpoch);

    if((neuf && i0 !== 0) || i0 > sceneItems.length){
      askResync();
      if(neuf) return;           // rien de fiable a peindre en attendant
    } else {
      if(neuf){
        sceneItems = []; sceneDone = 0;
        if(committed) committed.width = committed.width;
        devoileS = false;
        /* NOUVELLE EPOQUE, NOUVEAU SECRET : un mot devoile ne doit pas le
           rester quand le mot suivant arrive — sinon celui qui a laisse son
           telephone sur la table donne le mot d'apres sans y toucher. */
        devoile = false;
      }
      /* LE CALQUE DEJA PEINT NE PEUT PAS REVENIR EN ARRIERE : si l'envoi
         reecrit un element qu'on avait fige, on refige a partir de la. Sans
         ça, un trait corrige resterait affiche dans sa version d'avant,
         indefiniment. */
      if(i0 < sceneDone){ sceneDone = i0; if(committed) committed.width = committed.width; repaintDone(); }
      sceneItems = sceneItems.slice(0, i0).concat(tail);
      if(n && sceneItems.length !== n) askResync();
      sceneEpoch = d.ep;
    }

    // L'EFFET PUBLIC : le meme pour tout le monde. Voir `jouerEffet`.
    jouerEffet(scene.fx);
    // ET LE NOTRE, s'il y en a un : la mort, ou « c'est ton tour ». Il voyage
    // dans la part privee, donc brouille — les voisins recoivent les octets
    // et ne savent pas de qui il s'agit.
    var mien = privee();
    if(mien) jouerEffet(mien.fx);

    /* ON REDESSINE QUAND LA SCENE A CHANGE, pas seulement quand on change
       d'ECRAN. C'etait le defaut le plus couteux du salon, et il se
       presentait comme un probleme de reseau.

       L'ancienne condition ne comparait que `screenKey()` — « selection »,
       « moi », « scene ». Or deux jets de des successifs sont tous les deux
       l'ecran « scene » : la cle ne bougeait pas, donc rien n'etait
       redessine, et le nouveau resultat n'apparaissait qu'au battement
       d'etat suivant. Mesure au banc : premiere scene 15 ms, chacune des
       suivantes 2 009 ms — c'est-a-dire exactement la periode de
       rediffusion. En 4G, ou un battement peut se perdre, ça devenait les
       dix secondes rapportees.

       On ne peut pas pour autant redessiner a chaque message : pendant un
       dessin, la scene change dix fois par seconde et reconstruire le DOM a
       ce rythme ferait clignoter l'ecran et perdrait le canevas. D'ou la
       SIGNATURE : tout ce qui se lit dans le DOM — le titre, les scores, le
       mot, le chrono — sans la liste des traits, qui, elle, se peint sur le
       canevas et n'a besoin que de `schedulePaint`. */
    var signe = signature();
    if(screenKey() !== etait || signe !== lastSigne){
      lastSigne = signe;
      render(1);
    } else {
      schedulePaint();
    }
    majForm();
  }

  /* CE QUI, DANS LA SCENE, SE LIT DANS LE DOM.

     `it` est exclu : c'est l'ardoise, elle va sur le canevas. `priv` l'est
     aussi — il change a chaque envoi puisqu'il est brouille avec un nonce,
     et le comparer redessinerait tout, tout le temps. Ce qu'il porte de
     visible (le mot, l'effet) est traite a part. */
  function signature(){
    if(!scene) return '';
    var out = [];
    for(var k in scene){
      if(k === 'it' || k === 'priv') continue;
      out.push(k + '=' + JSON.stringify(scene[k]));
    }
    /* NOTRE PART, MAIS DESCELLEE : le mot et les boutons qu'elle porte. Sans
       elle, un « passer » qui tombait dans la meme seconde que l'envoi
       precedent ne changeait rien de public — le mot suivant et les boutons
       rearmes attendaient alors le prochain battement du chrono. */
    var mien = privee();
    if(mien){
      out.push('priv=' + JSON.stringify([mien.text, mien.label, mien.actes]));
    }
    /* Le nombre de traits entre quand meme dans la signature, mais seulement
       comme un COMPTE : il faut redessiner quand l'ardoise s'efface d'un
       coup (nouvelle manche), pas a chaque point ajoute. */
    out.push('#' + (sceneItems.length === 0 ? '0' : '1'));
    return out.join('|');
  }

  function askResync(){
    /* PAS PLUS D'UNE PAR SECONDE. Le maitre repond a la premiere, et la
       reponse met un aller-retour a revenir : sans ce frein, une seconde de
       reseau capricieux produirait dix demandes, dix ardoises completes en
       retour, et acheverait le canal qu'on essayait de menager. */
    if(Date.now() - askedAt < 1000) return;
    askedAt = Date.now();
    send('resync', {});
  }

  /* Apres un « ajoute-moi », c'est le MAITRE qui a choisi l'identifiant du
     joueur cree : on l'apprend en lisant l'etat, et on le retient comme un
     choix ordinaire. */
  function learnClaim(){
    if(!pending || pending.kind !== 'add') return;
    if(!state || !state.claims || !state.claims[dev]) return;
    myClaim = state.claims[dev];
    S.setItem(claimKey, myClaim);
  }

  /* ON SE RE-REVENDIQUE TOUT SEUL.
     Si l'etat ne nous attribue plus le joueur qu'on avait choisi, deux cas
     seulement : soit le maitre nous a oublies faute de nouvelles, soit
     quelqu'un d'autre a pris ce joueur. Dans le premier on redemande, dans
     le second on lache — c'est la seule façon de distinguer un decrochage
     d'un vrai changement, et de ne pas se battre indefiniment avec un autre
     telephone pour le meme prenom. */
  function reclaim(){
    if(!myClaim || !state) return;
    // Pas pendant que l'invite saisit un mot de passe : il s'occupe deja du
    // probleme, et rejouer la demande ne ferait qu'ajouter du trafic.
    if(askPass) return;
    var claims = state.claims || {};
    if(claims[dev] === myClaim) return;
    for(var d in claims){
      if(claims[d] === myClaim){
        /* Quelqu'un d'autre est ce joueur : on renonce. Et on retire la
           demande en vol — sans ça, la surveillance la declarait ignoree
           cinq secondes plus tard et accusait le mot de passe, juste apres
           une passation parfaitement legitime. */
        myClaim = null;
        pending = null;
        S.removeItem(claimKey);
        render(1);
        return;
      }
    }
    if(pending) return;              // une demande est deja en vol
    intent('claim', { player: myClaim });
  }

  function startBeat(){
    stopBeat();
    beat = setInterval(function(){ if(joined) send('hello', {}); }, HEARTBEAT_MS);
  }
  function stopBeat(){
    if(beat){ clearInterval(beat); beat = null; }
  }

  /* LE MOT DE PASSE NE SE REFUSE PAS, IL S'IGNORE.

     Sur un canal de diffusion il n'y a pas de reponse a une intention :
     le maitre applique, ou ne fait rien. Un mot de passe faux ne
     produit donc aucune erreur — l'invite appuie, et il ne se passe
     rien, ce qui ressemble a une panne.

     D'ou cette surveillance : si une intention reste sans effet
     plusieurs secondes alors qu'on recoit bien l'etat, c'est qu'elle
     est ignoree. On demande alors le mot de passe. */
  setInterval(function(){
    if(!pending) return;
    if(state && satisfied(state)){ learnClaim(); pending = null; return; }

    /* PREMIER TEMPS : ON REJOUE. Silencieusement, une seule fois, et sans
       toucher a l'ecran — l'invite n'a pas a savoir qu'un message s'est
       perdu. C'est ce qui manquait : la version precedente sautait
       directement a l'accusation. */
    if(!pending.retried && Date.now() - pending.at >= RETRY_MS){
      pending.retried = true;
      send(pending.kind, pending.data);
      return;
    }

    if(Date.now() - pending.at < PENDING_MS) return;

    /* SECOND TEMPS : ça ne passe toujours pas. TROIS situations bien
       differentes, et il a fallu les confondre pour comprendre qu'il fallait
       les separer. */

    /* 1. LA PAGE EST TROP ANCIENNE POUR CE SALON, et c'est la cause qui a
          coute le plus cher.

          Le maitre verifie l'identite de chaque intention : l'identifiant de
          l'appareil doit etre l'empreinte du secret transmis. Une page
          anterieure a ce changement envoie un identifiant tire au hasard, qui
          ne correspondra jamais — le salon jette donc TOUT ce qu'elle envoie,
          en silence. L'invite, lui, recoit l'etat sans probleme et n'a aucune
          raison de soupconner sa page.

          On le detecte a l'empreinte diffusee par le maitre, et on le dit :
          demander un mot de passe ici envoie chercher pendant une heure
          quelque chose qui n'existe pas. */
    if(state && state.pv && state.pv !== PAGE_VERSION){
      askPass = false;
      err = 'Cette page est trop ancienne pour ce salon : il refuse tout ce '
          + 'qu’elle envoie. Elle doit etre re-televersee chez l’hebergeur '
          + 'par l’organisateur, puis rechargee ici.';
      render(1);
      return;
    }

    var verrouille = !!(state && state.lock);

    // 4. On GARDE le geste refuse : il sera rejoue si un mot de passe le
    // debloque. Sans ça, celui qui venait de taper son prenom devait le
    // retaper apres avoir saisi le mot de passe.
    refused = pending;
    pending = null;

    if(verrouille){
      askPass = true;
      err = pass ? 'Mot de passe refuse.' : '';
      render(1);
      return;
    }

    /* LE SALON N'A PAS DE MOT DE PASSE : lui en demander un enverrait
       chercher une panne qui n'existe pas. On le dit tel quel, et on laisse
       le geste refait a portee de doigt. */
    askPass = false;
    err = 'Le salon n\u2019a pas repondu. Reessaie.';
    render(1);
  }, 1000);

  // ------------------------------------------------------------ rendu

  /* MEME PRECAUTION QUE SUR LA PAGE WI-FI, pour la meme raison : la
     page se redessine a chaque etat recu, ce qui detruit le champ de
     saisie et referme le clavier au milieu d'un mot de passe. On ne
     saute que le redessin d'un ecran PAR LUI-MEME ; un changement
     d'ecran passe toujours. */
  /* LE SALON EST VERROUILLE ET ON N'A PAS ENCORE LE MOT DE PASSE.

     On le demande AVANT de laisser choisir un joueur, parce que sinon le
     premier geste part, se fait ignorer, et l'invite passe par un echec
     avant d'apprendre ce que le salon aurait pu lui dire tout de suite. Le
     maitre diffuse `lock` : autant s'en servir. */
  function verrouille(){
    return !!(state && state.lock) && !pass;
  }

  function screenKey(){
    if(askPass || verrouille()) return 'pass';
    if(!state) return 'wait';
    var tenu = myClaim || (state.claims && state.claims[dev]);
    /* LA SCENE NE PASSE PAS DEVANT LA SELECTION, et c'est volontaire : tant
       qu'on n'a pas dit qui on est, on n'est pas dans la partie, et regarder
       l'ardoise avant d'exister ferait rater le seul geste qui compte. Un
       bandeau signale la partie en cours sur l'ecran de selection. */
    if(tenu && scene) return 'scene';
    if(tenu) return 'me';
    return adding ? 'pick-add' : 'pick';
  }

  function typing(){
    var a = document.activeElement;
    if(a && a.tagName === 'INPUT') return true;
    /* La fenetre entre le doigt qui quitte le champ et le clic qui
       arrive : reconstruire la page pendant ce laps detruit le bouton
       avant que son appui ne soit traite. */
    return (Date.now() - lastBlur) < 700;
  }

  function render(force){
    var key = screenKey();
    if(!force && key === lastKey && typing()) return;
    lastKey = key;

    app.innerHTML = '';
    /* LE PIED DE PAGE EST POSE AVANT LES SORTIES ANTICIPEES. Il ne
       l'etait qu'a la fin du chemin le plus long, donc l'ecran du mot de
       passe gardait le compte de joueurs de l'ecran precedent. */
    document.getElementById('foot').textContent =
      (state && state.players)
        ? state.players.length + ' joueur(s) dans la partie' : '';
    /* « AUCUN SALON » EST FAUX EN WI-FI, et c'est la seule chose que
       l'invite voit pendant que le flux s'etablit : la page y est servie par
       le telephone maitre lui-meme, donc il y a forcement un salon — on n'en
       connait juste pas encore le nom. */
    document.getElementById('sub').textContent =
      state ? ('Salon ' + (state.code || code))
            : (code ? ('Salon ' + code + ' — connexion…')
                    : (CONFIG.mode === 'lan' ? 'Connexion au salon…'
                                             : 'Aucun salon'));

    /* LA PAGE EST-ELLE EN RETARD SUR L'APPLI ?

       Le seul cas ou ça arrive est la page 4G, hebergee a part. Le message
       s'adresse donc a quelqu'un qui ne peut rien y faire lui-meme : il
       nomme le geste, et la personne qui peut le faire. */
    if(state && state.pv && state.pv !== PAGE_VERSION){
      var vieux = el('div','err',
        'Cette page est plus ancienne que l’appli du salon. '
        + 'Demande a l’organisateur de re-televerser web/join/index.html '
        + 'chez l’hebergeur, puis recharge.');
      app.appendChild(vieux);
    }

    if(err){ app.appendChild(el('div','err',err)); }

    if(askPass || verrouille()){
      var c=el('div','card');
      c.appendChild(el('div','lbl','Mot de passe'));
      if(!err){
        c.appendChild(el('div','hint',
          'Ce salon en demande un pour rejoindre la partie.'));
      }
      var i=el('input'); i.type='text';
      i.placeholder='Demande-le a l’organisateur';
      i.value = draft;
      i.oninput = function(){ draft = i.value; };
      i.onblur = function(){ lastBlur = Date.now(); };
      c.appendChild(i);
      var b=el('button','primary','Entrer');
      b.onclick=function(){
        pass = i.value.trim();
        S.setItem(passKey, pass);
        draft = '';
        i.blur(); askPass = false; err='';
        /* ON REFAIT LE GESTE QUI AVAIT ETE IGNORE, et pas un simple
           bonjour : un « ajoute-moi » perdu obligeait a retaper son
           prenom. */
        if(refused){
          var geste = refused; refused = null;
          intent(geste.kind, geste.kind === 'claim'
            ? { player: geste.player } : (geste.data || {}));
        } else {
          send('hello', {});
        }
        render(1);
      };
      c.appendChild(b); app.appendChild(c);
      setTimeout(function(){ i.focus(); }, 0);
      return;
    }

    if(!state){
      var w=el('div','card');
      w.appendChild(el('div','lbl','Patiente'));
      w.appendChild(el('div',null, joined
        ? 'En attente du telephone principal…'
        : 'Connexion au salon…'));
      app.appendChild(w);
      return;
    }

    /* NOTRE JOUEUR D'ABORD, celui de l'etat ensuite. Tant qu'on n'a pas
       renonce (voir `reclaim`), on reste sur l'ecran « tu es connecte » :
       repartir a la selection a chaque trou de reseau serait insupportable
       en pleine partie. */
    var players = state.players || [];
    var mineId = myClaim || (state.claims ? state.claims[dev] : null);
    /* LE JOUEUR A-T-IL ETE SUPPRIME ? On tient notre choix contre les
       decrochages, mais pas contre sa disparition : sinon la page reste
       bloquee sur « Tu es connecte — Joueur », sans nom et sans issue autre
       que « ce n'est pas moi ». */
    if(mineId && players.length){
      var existe = false;
      players.forEach(function(p){ if(p.id === mineId) existe = true; });
      if(!existe){
        myClaim = null; pending = null;
        S.removeItem(claimKey);
        mineId = null;
      }
    }

    if(mineId && scene){
      sceneScreen(players, mineId);
      /* APRES LA SCENE, ET SUR TOUS LES JEUX : c'est tout l'interet du
         souvenir. Pose avant, il passerait devant le jeu en cours ; absent,
         il ne servirait a rien. */
      poserSouvenir(app);
      schedulePaint();
      return;
    }

    if(mineId){
      var mine=null;
      players.forEach(function(p){ if(p.id===mineId) mine=p; });
      if(state.game){
        app.appendChild(el('div','banner','Partie en cours : '+state.game));
      }
      poserSouvenir(app);
      var confirme = state.claims && state.claims[dev] === mineId;
      var c2=el('div','card');
